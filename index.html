<style>
:root{
  --bg:#f8f7f4; --surface:#fff; --surface-2:#f2f0eb; --ink:#1d1c1a; --ink-2:#47443e; --muted:#706c64;
  --line:#e2dfd7; --line-2:#ece9e2;
  --accent:#1f5f8b; --accent-ink:#174a6d; --accent-soft:#e7eff6;
  --gA:#2e7d4f; --gA-bg:#e4f1e8; --gB:#2563a8; --gB-bg:#e5edf8; --gC:#9a5f00; --gC-bg:#f7ecd6; --gD:#77508a; --gD-bg:#f0e8f3; --gX:#66645f; --gX-bg:#ebe9e4;
  --k-calc:#0f766e; --k-calc-bg:#e0f2ef; --k-gap:#a8325a; --k-gap-bg:#f8e6ec; --k-fig:#4652b0; --k-fig-bg:#e9eaf8;
  --k-lit:#56606b; --k-lit-bg:#eceef0; --k-law:#86531f; --k-law-bg:#f5ebdf;
  --warn:#8a5a00; --warn-bg:#fbf1dc; --note:#1f5f8b; --note-bg:#eaf1f8; --bad:#a8325a; --bad-bg:#f8e6ec;
  --c1:#2a78d6; --c2:#e0672f; --c3:#6b6b6b; --grid:#e7e4dd; --axis:#b8b4aa;
  --shadow:0 1px 2px rgba(20,20,20,.05),0 10px 28px -20px rgba(20,20,20,.45);
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  --serif:"Source Serif 4","Iowan Old Style","Palatino Linotype",Georgia,"Noto Serif TC",serif;
  --mono:ui-monospace,SFMono-Regular,"Cascadia Mono",Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141416; --surface:#1d1e21; --surface-2:#25262a; --ink:#ecebe6; --ink-2:#cbc8c0; --muted:#9b988f;
  --line:#34353a; --line-2:#2a2b30; --accent:#86b9e6; --accent-ink:#a9cdee; --accent-soft:#1d2834;
  --gA:#72c592; --gA-bg:#1b2a21; --gB:#86b4ee; --gB-bg:#1b2433; --gC:#e2ad55; --gC-bg:#2e2616; --gD:#c7a1d8; --gD-bg:#2a212f; --gX:#a7a49c; --gX-bg:#2a2a2b;
  --k-calc:#5fc4b9; --k-calc-bg:#17292a; --k-gap:#e48aa8; --k-gap-bg:#2f1c24; --k-fig:#9aa3ec; --k-fig-bg:#1f2236;
  --k-lit:#a6afb9; --k-lit-bg:#24272b; --k-law:#d9a46c; --k-law-bg:#2d2419;
  --warn:#e2ad55; --warn-bg:#2b2416; --note:#86b9e6; --note-bg:#1b2632; --bad:#e48aa8; --bad-bg:#2f1c24;
  --c1:#4d93e8; --c2:#ec7b47; --c3:#a7a49c; --grid:#2c2d32; --axis:#4b4c52;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px -22px rgba(0,0,0,.9);
}}
:root[data-theme="dark"]{
  --bg:#141416; --surface:#1d1e21; --surface-2:#25262a; --ink:#ecebe6; --ink-2:#cbc8c0; --muted:#9b988f;
  --line:#34353a; --line-2:#2a2b30; --accent:#86b9e6; --accent-ink:#a9cdee; --accent-soft:#1d2834;
  --gA:#72c592; --gA-bg:#1b2a21; --gB:#86b4ee; --gB-bg:#1b2433; --gC:#e2ad55; --gC-bg:#2e2616; --gD:#c7a1d8; --gD-bg:#2a212f; --gX:#a7a49c; --gX-bg:#2a2a2b;
  --k-calc:#5fc4b9; --k-calc-bg:#17292a; --k-gap:#e48aa8; --k-gap-bg:#2f1c24; --k-fig:#9aa3ec; --k-fig-bg:#1f2236;
  --k-lit:#a6afb9; --k-lit-bg:#24272b; --k-law:#d9a46c; --k-law-bg:#2d2419;
  --warn:#e2ad55; --warn-bg:#2b2416; --note:#86b9e6; --note-bg:#1b2632; --bad:#e48aa8; --bad-bg:#2f1c24;
  --c1:#4d93e8; --c2:#ec7b47; --c3:#a7a49c; --grid:#2c2d32; --axis:#4b4c52;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 12px 32px -22px rgba(0,0,0,.9);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.8;overflow-x:hidden}
a{color:var(--accent-ink);text-underline-offset:2px}
a:hover{color:var(--accent)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
.en{font-family:var(--serif);font-style:italic}
code,.mono{font-family:var(--mono);font-size:.9em}

/* ---------------- 頂欄 */
.top{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:1200px;margin:0 auto;padding:8px 20px;display:flex;align-items:center;gap:16px}
.brand{text-decoration:none;color:var(--ink);font-weight:700;white-space:nowrap;line-height:1.25}
.brand small{display:block;font-weight:400;font-size:11.5px;color:var(--muted)}
.nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.nav::-webkit-scrollbar{display:none}
.nav a{padding:6px 11px;border-radius:7px;text-decoration:none;color:var(--ink-2);font-size:14.5px;white-space:nowrap}
.nav a:hover{background:var(--surface-2);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.theme{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:4px 10px;cursor:pointer;font-size:13px;color:var(--ink-2);white-space:nowrap}

/* ---------------- 版面 */
.view{display:none;max-width:1200px;margin:0 auto;padding:28px 20px 72px}
.view.on{display:block}
.wrap{display:grid;grid-template-columns:200px minmax(0,1fr);gap:40px;align-items:start}
.toc{position:sticky;top:76px;font-size:14px;border-left:2px solid var(--line);padding-left:12px}
.toc a{display:block;padding:3px 0;color:var(--muted);text-decoration:none}
.toc a:hover,.toc a.on{color:var(--accent-ink)}
.toc a.on{font-weight:600}
.article{max-width:780px;min-width:0}
h1{font-size:30px;line-height:1.35;margin:0 0 6px;letter-spacing:.01em}
h2{font-size:23px;line-height:1.4;margin:48px 0 14px;padding-top:6px}
h3{font-size:18px;margin:30px 0 8px}
h4{font-size:16px;margin:20px 0 6px}
p{margin:0 0 14px}
ul,ol{margin:0 0 14px;padding-left:1.4em}
li{margin:4px 0}
.lede{font-size:17.5px;color:var(--ink-2)}
.muted{color:var(--muted)}
.small{font-size:13.5px}
hr{border:0;border-top:1px solid var(--line);margin:28px 0}

/* ---------------- 首屏 */
.hero{padding:10px 0 4px;max-width:900px}
.kicker{font-size:13px;letter-spacing:.06em;color:var(--muted);margin-bottom:6px}
.hero h1 .en{font-size:.82em;display:block;color:var(--ink-2);font-weight:400;margin-top:4px}
.meta-line{font-size:14px;color:var(--muted);margin:10px 0 14px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border:1px solid var(--line);border-radius:8px;background:var(--surface);text-decoration:none;color:var(--ink);font-size:14px;cursor:pointer}
.btn:hover{border-color:var(--accent);color:var(--accent-ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.primary{color:#0f1720}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.primary{color:#0f1720}}
.epi{margin:22px 0 6px;padding:14px 18px;border-left:3px solid var(--accent);background:var(--surface);border-radius:0 var(--r) var(--r) 0;box-shadow:var(--shadow);max-width:780px}
.epi q{font-family:var(--serif);font-size:19px;font-style:italic;quotes:"“" "”"}
.epi .who{display:block;font-size:13px;color:var(--muted);margin-top:4px}

/* ---------------- 統計格 */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:18px 0 8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat b{display:block;font-size:24px;line-height:1.2;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.gbar{display:flex;height:10px;border-radius:5px;overflow:hidden;margin:8px 0 4px;background:var(--line-2)}
.gbar i{display:block;height:100%}
.gleg{display:flex;flex-wrap:wrap;gap:10px;font-size:12.5px;color:var(--muted)}
.gleg span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;background:var(--c)}

/* ---------------- 標籤與連結片 */
.chip{display:inline-flex;align-items:center;gap:3px;font-family:var(--mono);font-size:12px;line-height:1.25;padding:2px 6px;border-radius:5px;border:1px solid transparent;cursor:pointer;vertical-align:1px;text-decoration:none;white-space:nowrap;max-width:100%}
.chip:hover{filter:brightness(.95);text-decoration:underline}
.chip.gA{color:var(--gA);background:var(--gA-bg)} .chip.gB{color:var(--gB);background:var(--gB-bg)}
.chip.gC{color:var(--gC);background:var(--gC-bg)} .chip.gD{color:var(--gD);background:var(--gD-bg)} .chip.gX{color:var(--gX);background:var(--gX-bg)}
.chip.kcalc{color:var(--k-calc);background:var(--k-calc-bg)} .chip.kgap{color:var(--k-gap);background:var(--k-gap-bg)}
.chip.kfig{color:var(--k-fig);background:var(--k-fig-bg)} .chip.klit{color:var(--k-lit);background:var(--k-lit-bg)} .chip.klaw{color:var(--k-law);background:var(--k-law-bg)}
.badge{display:inline-block;font-size:12px;line-height:1.5;padding:1px 8px;border-radius:99px;border:1px solid var(--line);color:var(--ink-2);background:var(--surface);white-space:nowrap}
.badge.g{font-weight:700;border:0}
.badge.gA{color:var(--gA);background:var(--gA-bg)} .badge.gB{color:var(--gB);background:var(--gB-bg)} .badge.gC{color:var(--gC);background:var(--gC-bg)}
.badge.gD{color:var(--gD);background:var(--gD-bg)} .badge.gX{color:var(--gX);background:var(--gX-bg)}
.badge.self{color:var(--k-calc);border-color:var(--k-calc)}
.badge.read{color:var(--warn);border-color:var(--warn)}
.badge.ocr{color:var(--k-fig);border-color:var(--k-fig)}
.coord{font-family:var(--mono);font-size:12.5px;color:var(--muted);white-space:nowrap}
.src-links{display:inline-flex;gap:10px;font-size:13px;flex-wrap:wrap}
.src-links a{white-space:nowrap}

/* ---------------- 區塊 */
.callout{border-radius:var(--r);padding:11px 15px;margin:14px 0;font-size:15px}
.callout.note{background:var(--note-bg);border-left:3px solid var(--note)}
.callout.warn{background:var(--warn-bg);border-left:3px solid var(--warn)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin:14px 0}
.verdict .kf{font-size:12.5px;color:var(--muted);letter-spacing:.04em}
.verdict h4{margin:2px 0 8px;font-size:16.5px;line-height:1.5}
.verdict .v{display:flex;gap:8px;align-items:flex-start;margin-bottom:8px;font-weight:600;font-size:15px}
.verdict .b{font-size:14.5px;color:var(--ink-2);margin:0}
.chart{margin:14px 0 6px;width:100%}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart-note{font-size:12.5px;color:var(--muted);margin:2px 0 12px}
.tbl{width:100%;border-collapse:collapse;font-size:14.5px;margin:12px 0}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:9px 10px;text-align:left;vertical-align:top}
.tbl th{font-size:13px;color:var(--muted);font-weight:600;background:var(--surface-2)}
.tbl-wrap{overflow-x:auto}
.law{margin:14px 0}
.law .hd{display:flex;flex-wrap:wrap;gap:8px;align-items:baseline;margin-bottom:6px}
.law .hd b{font-size:15.5px}
.law blockquote{margin:8px 0;padding:8px 12px;border-left:3px solid var(--k-law);background:var(--surface-2);font-family:var(--serif);font-size:15px;line-height:1.6;border-radius:0 6px 6px 0}
.law.tw{border-style:dashed}
.law .zh{font-size:14.5px;color:var(--ink-2)}
.law .note{font-size:14.5px}

/* ---------------- 帳本 */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);position:sticky;top:58px;z-index:5}
.filters input[type=search]{flex:1 1 220px;min-width:0;padding:7px 10px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);font:inherit;font-size:14.5px}
.filters select{padding:6px 8px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);font:inherit;font-size:14px;max-width:100%}
.filters label{font-size:14px;display:inline-flex;gap:5px;align-items:center;cursor:pointer}
.count{font-size:13.5px;color:var(--muted);margin-left:auto}
.claim{margin:10px 0;padding:14px 16px}
.claim .row1{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:6px}
.claim .id{font-family:var(--mono);font-weight:700;font-size:14px}
.claim .zh{margin:0 0 6px}
.claim .note{margin:0 0 6px;font-size:14.5px;color:var(--ink-2);padding-left:10px;border-left:2px solid var(--line)}
.claim .note::before{content:"評析　";color:var(--muted);font-size:12.5px}
.claim .refs{display:flex;flex-wrap:wrap;gap:5px;align-items:center;font-size:13px;color:var(--muted)}
.claim.flash{outline:2px solid var(--accent);outline-offset:3px}
.typ{font-size:12.5px;color:var(--muted)}
.empty{padding:30px;text-align:center;color:var(--muted)}

/* ---------------- 圖、核算、缺口、文獻 */
.item{margin:18px 0;padding:18px 20px}
.item .hd{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:baseline;margin-bottom:8px}
.item .hd h3{margin:0;font-size:18px}
.kv{display:grid;grid-template-columns:5.5em minmax(0,1fr);gap:4px 12px;font-size:14.5px;margin:8px 0}
.kv dt{color:var(--muted)}
.kv dd{margin:0}
.labels{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.lab{font-size:13px;padding:2px 8px;border-radius:6px;background:var(--surface-2);border:1px solid var(--line-2)}
.lab b{font-variant-numeric:tabular-nums}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:6px}
.two h4{margin:0 0 4px;font-size:14px;color:var(--muted)}
.two ul{font-size:14.5px;margin:0}
.sev{font-weight:700}
.sev.h{color:var(--bad)} .sev.m{color:var(--warn)} .sev.l{color:var(--muted)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:5px 12px;cursor:pointer;font-size:14px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.vd{font-size:12.5px;font-weight:700;padding:1px 8px;border-radius:99px}
.vd.ok{color:var(--gA);background:var(--gA-bg)} .vd.omits{color:var(--gC);background:var(--gC-bg)}
.vd.unchecked{color:var(--gX);background:var(--gX-bg)} .vd.missing{color:var(--gD);background:var(--gD-bg)}

/* ---------------- 抽屜 */
#scrim{position:fixed;inset:0;background:rgba(10,10,12,.32);z-index:60}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--bg);border-left:1px solid var(--line);z-index:70;overflow-y:auto;box-shadow:-18px 0 40px -28px rgba(0,0,0,.6);padding:18px 20px 40px}
#drawer .x{position:sticky;top:0;float:right;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:2px 10px;cursor:pointer;font-size:14px}
#drawer h3{margin:4px 0 10px;font-size:17px}
[hidden]{display:none!important}

/* ---------------- 頁尾 */
footer{border-top:1px solid var(--line);color:var(--muted);font-size:13px}
footer .in{max-width:1200px;margin:0 auto;padding:18px 20px 36px}

/* ---------------- 窄螢幕 */
@media (max-width:900px){
  .wrap{grid-template-columns:minmax(0,1fr);gap:0}
  .toc{position:static;border-left:0;padding:0;margin:0 0 10px;display:flex;flex-wrap:wrap;gap:6px}
  .toc a{padding:3px 9px;border:1px solid var(--line);border-radius:99px;font-size:13px;background:var(--surface)}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:640px){
  body{font-size:15.5px}
  .top-in{padding:8px 16px;gap:10px}
  .brand small,.brand .b-pre{display:none}
  .view{padding:20px 16px 60px}
  h1{font-size:24px}
  h2{font-size:20.5px;margin-top:38px}
  .grid2,.two{grid-template-columns:minmax(0,1fr)}
  .kv{grid-template-columns:minmax(0,1fr)}
  .kv dt{margin-top:6px}
  .filters{position:static}
  .tbl.stack thead{display:none}
  .tbl.stack tr{display:block;border:1px solid var(--line);border-radius:var(--r);margin:10px 0;padding:6px 10px;background:var(--surface)}
  .tbl.stack td{display:block;border:0;padding:4px 0}
  .tbl.stack td::before{content:attr(data-h);display:block;font-size:12px;color:var(--muted)}
}
@media print{.top,.toc,#drawer,#scrim,.filters,.btns{display:none!important}.view{display:block!important}}

/* ---------------- SVG */
.svg-t{fill:var(--ink);font-family:var(--sans)}
.svg-m{fill:var(--muted);font-family:var(--sans)}
.svg-grid{stroke:var(--grid)}
.svg-axis{stroke:var(--axis)}
.svg-c1{fill:var(--c1);stroke:var(--c1)} .svg-c2{fill:var(--c2);stroke:var(--c2)} .svg-c3{fill:var(--c3);stroke:var(--c3)}
.svg-line1{stroke:var(--c1)} .svg-line2{stroke:var(--c2)} .svg-line3{stroke:var(--c3)}
.svg-bg{fill:var(--surface)}
.svg-shade{fill:var(--surface-2)}
.node rect{fill:var(--surface);stroke:var(--line)}
.node:hover rect{stroke:var(--accent)}
.e-A{stroke:var(--gA)} .e-B{stroke:var(--gB)} .e-C{stroke:var(--gC)} .e-D{stroke:var(--gD)} .e-X{stroke:var(--bad)}
.f-A{fill:var(--gA)} .f-B{fill:var(--gB)} .f-C{fill:var(--gC)} .f-D{fill:var(--gD)} .f-X{fill:var(--bad)}
</style>

nthropic；作者自己在 §6¶7 也說許多做法無法複製到整體經濟。","refs":["E6","G15"],"anchors":["leading indicator"],"web":"could be a leading indicator"},{"id":"K1","sec":"S1","key":"KF1","p":[2],"type":"desc","src":["hr","tele"],"grade":"B","zh":"初階技術職在招募中的占比變小；同一期間，AI agent 的工時相對員工快速擴大，到 8 月，互動式 agent 的工時是員工的 6 倍。","note":"兩件事是並列（原文用「同時發生」的句型），沒有主張因果。6 倍的口徑只含員工自己發動的互動式 session，人類工時以人數乘每週 40 小時計（圖 2 註）。","refs":["fig2","N7"],"nums":["6 to 1",["40 hours","S4:fig2"]],"anchors":["smaller share of junior technical positions"],"web":"interactive AI agent hours outnumbered"},{"id":"K2","sec":"S1","key":"KF2","p":[2],"type":"cause","src":["out"],"grade":"B","zh":"agent 擴散後，人均程式碼、每位業務的成交、合約處理量都上升；追蹤同一位員工，採用新 AI 工具後產出上升。","note":"同一人前後比較（圖 4）只做了工程師與業務兩種職能；「合約處理量」只有描述性的時間序列（圖 3），沒有同一人比較。重點發現把兩種強度不同的證據放在同一句。","refs":["fig3","fig4","P6"],"anchors":["processing more contracts","same employee over time"],"web":"processing more contracts"},{"id":"K3","sec":"S1","key":"KF3","p":[2],"type":"meas","src":["tele"],"grade":"B","zh":"加速讓人的注意力成為 agent 產出的瓶頸：即使是非技術員工，讀完自己 Claude agent 的全部輸出也要花掉半個工作週；員工因此轉向打造可視化工具、監控 agent 流程這類「後設工作」。","note":"「半個工作週」是把輸出 token 換算成閱讀時數的示意指標（圖 6）。以圖 6 最後一個月計，5 個非技術群組中有 4 組超過 20 小時，行銷與公關只有 12 小時；改用前一個月，只剩 2 組超過（讀圖）。","refs":["fig6","N6"],"fig":[["12 h","fig6"]],"calc":["5","4","20","2"],"anchors":["half their work week","meta-work"],"web":"half their work week"},{"id":"K4","sec":"S1","key":"KF4","p":[2],"type":"desc","src":["hire"],"grade":"C","zh":"工作組織的改變也反映在招募主管的優先順序：愈來愈重視自主性與判斷力，相對降低技術領域專長與執行能力的比重。","note":"來源是以自動編碼器處理的面試評分卡（§5¶15–16）。報告沒有給各類評語的占比，也沒說編碼器怎麼驗證。","refs":["H1","H2","G4"],"anchors":["autonomy and judgment"],"web":"emphasize autonomy and judgment"},{"id":"I1","sec":"S2","key":"¶1","p":[2],"type":"desc","src":["tele"],"grade":"B","zh":"Anthropic 已把工作流程全面圍繞 AI 重塑：agent 穿梭在 Slack 對話裡、排會議、自主修 bug、協作大型工程；agent 的工時是人類的 6 倍。","note":"這一句沒有標明口徑。對照重點發現與圖 2，6 倍指的是互動式 session（不含自主式）；加上自主式只會更高，所以不算誇大，但讀者在這裡無從得知口徑。","refs":["K1","fig2"],"nums":["6 to 1"],"anchors":["thoroughly molded its workflows"],"web":"outnumber human hours"},{"id":"I2","sec":"S2","key":"¶2","p":[2],"type":"meas","src":["hr","tele","out","survey","comm","cal","hire","intv"],"grade":"A","zh":"資料來源：Anthropic 內部的就業、AI 使用、產出指標、員工調查、內部通訊型態、員工行事曆與招募決策紀錄七類，外加 17 場員工訪談。","note":"七類資料都只在 Anthropic 內部，外界無法重製；訪談對象怎麼選、涵蓋哪些職能，報告沒有說明。","refs":["G15","G16"],"nums":["17"],"anchors":["hiring decision records"],"web":"17 employee interviews"},{"id":"I3","sec":"S2","key":"¶3","p":[2,3],"type":"cause","src":["hr","out","hire"],"grade":"B","zh":"即使公司在成長，初階技術職的「相對」招募仍放緩；工程與非技術員工的生產力都在採用 coding agent 時急升；招募主管更重視自主與判斷，而不是特定技術專長。","note":"作者在這裡用了「相對」——這個限定詞很關鍵：占比下降不等於人數減少（N1）。","refs":["N1"],"anchors":["relative hiring"],"web":"relative hiring in junior technical positions"},{"id":"I4","sec":"S2","key":"¶3","p":[3],"type":"anec","src":["intv"],"grade":"D","zh":"AI 密集組織的一個特徵，是不斷有壓力要把自己從瓶頸位置移開；一位工程師形容自己面對一整支 Claude 大軍，每一個都在爭取自己的注意力。作者的結論：員工仍然關鍵，但貢獻的性質變了。","note":"全站唯一的逐字引文就是這一句（見頁首）。","refs":[],"anchors":["an army of Claudes"],"web":"an army of Claudes"},{"id":"I5","sec":"S2","key":"¶4","p":[3],"type":"norm","src":[],"grade":"D","zh":"Anthropic 的回應：建立追蹤「可能受衝擊職務」的預警系統，並在職務演變時優先內部轉調。作者也承認，這些承諾究竟該長什麼樣子，仍是難題。","note":"預警系統的指標、門檻與治理方式都沒有揭露（§6¶9 只多說了一句：以職務層級的需求與生產力指標對照 AI 能力與使用），外界無法評估它是否有效。","refs":["E9","G7"],"anchors":["early warning system","internal redeployments"],"web":"early warning system to track jobs"},{"id":"L1","sec":"S3","key":"¶1","p":[3,18],"type":"extrap","src":["fin","hr","ext"],"grade":"C","zh":"Anthropic 擴張很快，但每一元營收雇用的人比上一代大型科技公司少：成立五年時，每名員工營收是 Meta、Google 同齡時的 2–4 倍。依註 1，Anthropic 的數字取自截至 2026 年 4 月十二個月的內部財務與人事紀錄，Google（2003）與 Meta（2009）依 10-K，全部平減到 2025 年幣值。","note":"三個問題。第一，只給倍數，沒給 Anthropic 的營收與人數，無法重算。第二，營收不等於附加價值：AI 實驗室的營收裡含大量算力成本，拿來跟 2003 年的 Google、2009 年的 Meta 比每人營收，口徑不同。第三，註 1 說 Google、Meta 的數字來自「成立 5 年時的 10-K」，但兩家當年都還沒上市（Google 2004 年、Facebook 2012 年才上市），那兩年沒有 10-K；數字應是取自日後 10-K 的歷年比較或 S-1。不影響方向，但出處寫得不精確。","refs":["G11","G14"],"nums":["2–4",["5 years","S6:fn1"],["twelve months","S6:fn1"]],"anchors":["revenue per employee"],"web":"revenue per employee as Meta and Google"},{"id":"L2","sec":"S3","key":"¶2","p":[3],"type":"anec","src":["intv"],"grade":"D","zh":"內部對「初階技術人力需求下降」的討論，2026 年 1 月始於核心技術部門：最倚重 Claude 的團隊發現寫程式與找 bug 可以愈來愈多交給 Claude；新模型加速了這個認知——一位受訪者說，效能工程師的能力提升幾乎一夜之間改變了他們要找的人。","note":"時間點和圖 1 職缺占比自 2025 年 12 月起下滑大致吻合，但「討論出現」本身是組織敘事，不是量測。","refs":["fig1"],"nums":["January 2026"],"anchors":["performance engineers"],"web":"uplift for performance engineers"},{"id":"L3","sec":"S3","key":"¶3","p":[3],"type":"desc","src":[],"grade":"C","zh":"到 4 月，工程與研究團隊已調低較低職等技術職的招募比重。","note":"「較低職等」（lower band）沒有定義，也沒說這句的資料來源是招募計畫、職缺系統還是主管說法。","refs":["G17"],"anchors":["lower band technical positions"],"web":"deemphasized hiring for lower band"},{"id":"L4","sec":"S3","key":"¶3","p":[3],"type":"cause","src":["survey"],"grade":"C","zh":"同月的主管調查：多數主管表示因為 AI 而改找不同的技能組合；約三分之一的 ML 主管、五分之一的軟體工程主管表示因為 AI 而少招人。","note":"主管自己判斷的因果。樣本數、回應率、題目措辭都沒有揭露；「多數」也沒給百分比。","refs":["G2","G3"],"anchors":["a third of ML","a fifth of SWE"],"web":"Around a third of ML"},{"id":"L5","sec":"S3","key":"¶4","p":[3,4],"type":"desc","src":["hr"],"grade":"A","zh":"技術部門的初階員工占比，從 2025 年初的 21% 降到 14%。","note":"這是「占比」。同一時期公司規模約成長為三倍，占比下降和初階人數增加可以同時成立：用報告自己的三個數字試算，初階技術員工的絕對人數約為原來的 1.84 倍（N1）。","refs":["N1","fig1"],"nums":["21%","14%"],"fig":[["14%","fig1"]],"calc":["1.84"],"anchors":["junior-level employees in technical departments"],"web":"from 21% to 14%"},{"id":"L6","sec":"S3","key":"¶4","p":[3,4],"type":"desc","src":["hr"],"grade":"A","zh":"初階技術職的「新進」占比降得更快：從 27% 降到 9%。","note":"要讓初階新進的「人數」不減，技術職新進總數得成長到 3 倍；報告沒給新進總數，所以無法判斷初階新進人數是增是減（N2）。圖 1 的新進線從 2025 年 5 月才開始，起點約 27.6%（讀圖）。","refs":["N2","fig1"],"nums":["27%","9%"],"fig":[["9%","fig1"]],"calc":["3"],"read":["27.6"],"anchors":["junior technical hires"],"web":"from 27% to 9%"},{"id":"L7","sec":"S3","key":"¶4","p":[3,4],"type":"desc","src":["hr"],"grade":"A","zh":"初階職缺自 2025 年 12 月起下降得特別急。","note":"圖 1 技術部門的初階職缺占比在 2025 年 11 月達到約 21.4% 的高點，到 2026 年 6 月只剩 6%。非技術部門的初階職缺占比也從約 31.5% 降到 13%，而且主要降在 2025 年——本文完全沒有討論（N13、G9）。","refs":["fig1","N13","G9"],"nums":["December 2025"],"fig":[["6%","fig1"],["13%","fig1"]],"read":["21.4","31.5"],"anchors":["Postings for juniors"],"web":"particularly sharply since December 2025"},{"id":"L8","sec":"S3","key":"¶5","p":[4],"type":"desc","src":["hr"],"grade":"A","zh":"技術部門占全公司就業的比重，一年內從 61% 降到 56%。","note":"這是 N1 試算需要的第二個數字。","refs":["N1"],"nums":["61%","56%"],"anchors":["employment share of technical departments"],"web":"from 61% to 56%"},{"id":"L9","sec":"S3","key":"¶5","p":[4],"type":"desc","src":["hr"],"grade":"B","zh":"技術招募的絕對數仍在成長，只是業務、財務、招募部門的密集招募成長得更快。","note":"報告自己承認技術招募的絕對數在成長——這是理解「占比下降」的關鍵，但沒有給數字。","refs":["N1","G1"],"anchors":["absolute terms"],"web":"continued growing in absolute terms"},{"id":"L10","sec":"S3","key":"¶5","p":[4],"type":"anec","src":["intv"],"grade":"D","zh":"作者的解讀：一部分是公司規模擴大後業務功能的自然擴張；一部分可能是 coding 工具讓非技術員工自己做軟體——例如一位業務代表花三到四小時，自己做出量身訂做的儀表板與資料流程。","note":"兩個解釋各占多少，沒有拆開。","refs":[],"anchors":["three to four hours"],"web":"three to four hours"},{"id":"L11","sec":"S3","key":"¶5","p":[4],"type":"desc","src":["tele"],"grade":"B","zh":"非技術員工（基準期沒有任何 commit、排除新進者）的 coding 類 agent session：2025 年 8 月每月 2 次，2026 年 5 月 90 次。","note":"單位不明：是每人每月，還是整個群體每月？兩種讀法的意義差很多（N17）。","refs":["N17","G17"],"nums":["2 per month","90"],"anchors":["no code commits at baseline"],"web":"2 per month in August 2025"},{"id":"L12","sec":"S3","key":"¶6","p":[4],"type":"desc","src":["out","hr"],"grade":"B","zh":"技術部門裡「沒在寫程式」（前 30 天沒有 commit）的員工占比，在截至 2026 年 4 月的一年內幾乎減半。","note":"沒給起點與終點的水準。","refs":["G2"],"nums":["30 days"],"anchors":["almost half"],"web":"fell by almost half"},{"id":"L13","sec":"S3","key":"¶6","p":[5],"type":"desc","src":["hr"],"grade":"A","zh":"一部分原因是非工程師的比重變薄：例如工程師對產品經理約 17 比 1，且自 2025 年起持續上升。","note":"","refs":[],"nums":["17 to 1"],"anchors":["product managers"],"web":"17 to 1"},{"id":"L14","sec":"S3","key":"¶6","p":[5],"type":"desc","src":["out"],"grade":"B","zh":"主管的 commit 數也翻倍；技術團隊裡的督導與協調角色，愈來愈多是親自寫碼、出貨。","note":"commit 數是程式碼活動量，不是產出價值。外部研究（Demirer 等人）發現 commit 的增幅傳到實際發布時大幅縮水。","refs":["lit:demirer"],"anchors":["commits from managers has also doubled"],"web":"commits from managers has also doubled"},{"id":"L15","sec":"S3","key":"¶7","p":[5],"type":"desc","src":["hr","intv"],"grade":"C","zh":"通常隨公司規模擴張的行政職沒有加速招募：agent 助理、自動化審核，加上客服工單外包，讓公司在快速成長中仍維持「行政輕量」；一位財務經理自己做了採購申請審查 agent。","note":"作者列出的三個原因裡，有一個是「外包」——那不是 AI 的效果。三者各占多少沒有拆開。","refs":[],"anchors":["clerical-light","ticket service outsourcing"],"web":"clerical-light"},{"id":"L16","sec":"S3","key":"¶8","p":[5],"type":"anec","src":["intv"],"grade":"D","zh":"即使與面對面互動緊密相關的文書工作也成長緩慢：一位行政助理自建排程與 email 分流 agent，認為最入門的行政角色已被 Claude 取代，自己轉做較高階的「幕僚長」型工作。","note":"","refs":[],"anchors":["executive assistant"],"web":"chief of staff"},{"id":"L17","sec":"S3","key":"¶9","p":[5],"type":"desc","src":["hr"],"grade":"B","zh":"再配置已經發生：在職滿一年的員工，2026 年每月跨部門移動的機率比 2025 年高 50%。","note":"相對增幅，沒給基準率。舉例：若原本每月 1% 的人換部門，提高 50% 也只是 1.5%（N10，示意）。","refs":["N10","G2"],"nums":["50%"],"calc":["1","1.5"],"anchors":["move across departments"],"web":"50% more likely to move across departments"},{"id":"L18","sec":"S3","key":"¶9","p":[5],"type":"anec","src":["intv"],"grade":"D","zh":"整個團隊也可能因為把工作交給 agent 而被重新配置：一個撰寫 Claude.ai 問候語等產品文案的設計團隊，2026 年春建立了能引導 agent 寫出好文案的 context graph，之後轉做 agent prompting、撰寫模型評測與 prompt。","note":"一個團隊的案例，說明「再配置」長什麼樣子，不能推論為普遍模式。","refs":[],"anchors":["context graph"],"web":"context graph"},{"id":"P1","sec":"S4","key":"¶1","p":[5],"type":"desc","src":["tele"],"grade":"B","zh":"依 agent session 遙測，2026 年 3 月，自主式加互動式 agent 的工時總和首度超過人類工時。","note":"自主式 session 的工時怎麼算，報告沒說明（圖 2 註只定義了互動式）。圖 2 只看互動式，全體員工那條線約在 5 月初才越過平價線（讀圖），兩者並不矛盾。","refs":["fig2","N11"],"nums":["March 2026"],"anchors":["autonomous and interactive agent work hours"],"web":"leapt past human work hours"},{"id":"P2","sec":"S4","key":"¶1","p":[5,6],"type":"desc","src":["tele"],"grade":"C","zh":"其中一部分來自大批 agent 從事工業規模的軟體工程：補例行測試與檢查、維護不斷膨脹的基礎設施程式碼、大規模轉譯 codebase。","note":"","refs":[],"anchors":["translate massive codebases"],"web":"translate massive codebases"},{"id":"P3","sec":"S4","key":"¶1","p":[6],"type":"meas","src":["tele","hr"],"grade":"B","zh":"只看員工個人部署的 agent（圖 2），到 8 月，agent 的工時是人類的 6 倍；圖中研究組織是 19 倍。","note":"口徑（圖 2 註）：只含員工發動的互動式 session，子 agent 合併計算；agent 工時是推論與工具執行的時間，但排除超過 30 分鐘的等待；人類工時是人數乘每週 40 小時（假設值）。三個地方會把比值推高：平行子 agent 的時間是相加的；一個 agent 小時不等於一個人類小時的工作量；人類若實際每週工作超過 40 小時，分母就被低估（每週 50 小時時，6 倍變 4.8 倍，N7）。","refs":["fig2","N7","N11"],"nums":["6 times",["30 minutes","S4:fig2"],["40 hours","S4:fig2"]],"fig":[["19×","fig2"],["6×","fig2"]],"calc":["50","4.8"],"anchors":["human handlers"],"web":"6 times as many hours"},{"id":"P4","sec":"S4","key":"¶2","p":[6],"type":"desc","src":["tele"],"grade":"C","zh":"Anthropic 是軟體公司，流經 agent 的 token 絕大部分用來產出程式碼；但個人助理 agent 也監看行事曆與訊息、排程、彙整待辦，並在會前自動簡報與會者與會議目的。","note":"","refs":[],"anchors":["personal assistant agents"],"web":"vast bulk of tokens"},{"id":"P5","sec":"S4","key":"¶3","p":[6,7],"type":"desc","src":["out"],"grade":"B","zh":"每位工程師的 commit 數成長最快，是 6 個月前的 5 倍（圖 3 標示 5.1 倍）。","note":"commit 是活動量指標。報告引用的同公司文章（Favaro & Clark）自己就說，以程式碼行數衡量的 8 倍幾乎確定高估了真實生產力；外部的 Demirer 等人發現 commit 增幅傳到實際發布時大幅縮水（240% 到 30%）。另外，圖 3 以 2025 年 12 月為 100，commit 線在基期前已從約 59 漲到 100（讀圖），倍數對基期的選擇很敏感（N12）。","refs":["fig3","N12","lit:rsi","lit:demirer"],"nums":["5x","6 months"],"fig":[["5.1×","fig3"],["100","fig3"]],"read":["59"],"ext":[["8","lit:rsi"],["240","lit:demirer"],["30","lit:demirer"]],"anchors":["commits per engineer have risen the fastest"],"web":"commits per engineer have risen the fastest"},{"id":"P6","sec":"S4","key":"fig3","p":[7],"type":"desc","src":["out"],"grade":"B","zh":"圖 3 其他職能（以 2025 年 12 月為 100）：資料科學家的查詢 3.1 倍、法務人員處理的合約 3.1 倍、業務成交 1.7 倍、招募人員錄用 1.4 倍、應付帳款處理的發票 1.4 倍。","note":"這是描述性時間序列，經 loess 平滑。業務、招募與法務的量都和公司業務爆炸成長高度相關（作者在 §4¶4 自己承認）。招募人員的指數在 2025 年 7 月已約 128（讀圖），相對當時只多約 9%。法務「合約 3.1 倍」沒有任何同一人比較或品質指標。","refs":["fig3","N12","G12"],"fig":[["3.1×","fig3"],["1.7×","fig3"],["1.4×","fig3"],["100","fig3"]],"read":["128"],"calc":["9"],"anchors":["Loess"],"web":"Productivity boom across functions"},{"id":"P7","sec":"S4","key":"¶3","p":[7],"type":"desc","src":["out"],"grade":"C","zh":"資料科學家要 Claude agent 即時把指標送上儀表板；非技術員工的產出也隨 coding agent 擴散而上升：律師處理更多合約、應付帳款處理更多發票、業務成交更多。","note":"","refs":["P6"],"anchors":["lawyers processed more contracts"],"web":"lawyers processed more contracts"},{"id":"P8","sec":"S4","key":"¶4","p":[7],"type":"meas","src":[],"grade":"-","self":true,"zh":"作者自承：同期公司業務爆炸成長（好模型好賣），所以改用「已採用 vs 尚未採用 agent 工具」的同月員工比較來估 AI 的獨立效果；並承認採用時點不是隨機的——例如即將啟動大專案的人先把工具備齊，就會讓估計偏誤。","note":"這是全篇方法上最誠實的一段：點名了最主要的替代解釋（業務成長）與最主要的偏誤來源（自選採用時點）。","refs":["fig4"],"anchors":["explosive business growth","tool adoption is not random"],"web":"tool adoption is not random"},{"id":"P9","sec":"S4","key":"¶5","p":[8],"type":"cause","src":["out","tele"],"grade":"B","zh":"追蹤 192 名採用 coding agent 的工程師，對照 74 名在研究期間都沒採用的工程師；採用後幾個月，工程師新增的程式碼量急升。","note":"讀圖：採用當月約 +0.98、第一個月 +1.31、第二個月 +1.85、第三個月 +1.01 對數點；若是自然對數差，約等於 2.7、3.7、6.4、2.7 倍（N3）。採用前四個月接近 0，前趨勢平坦——這是這個面板可信的地方。限制有三：結果變數是「新增程式碼」，不是價值；對照組只有 74 人、約占樣本的 28%（N15），而且是「到最後都沒採用」的人，本身可能就不同；交錯採用搭配雙向固定效果，在處理效果因人因時而異時有已知偏誤，報告沒說用的是哪種估計式。","refs":["fig4","N3","N15","G3"],"nums":["192","74"],"read":["0.98","1.31","1.85","1.01"],"calc":["2.7","3.7","6.4","28"],"anchors":["192 engineers"],"web":"We follow 192 engineers"},{"id":"P10","sec":"S4","key":"¶5","p":[8,9],"type":"cause","src":["out"],"grade":"B","zh":"為檢驗「AI 垃圾碼」，比較同一人、同一個月、同一個目錄裡，由 coding agent 寫的與本人直接寫的程式碼——後續被刪除或回退的比率沒有差異。","note":"設計很聰明：同人、同月、同目錄，排除了人與專案的差異。但「沒有顯著差異」不等於「證明一樣好」：6 個指標的信賴區間寬窄不一，例如新增 lint 抑制約 −2 到 +1.9 個百分點、被 bug-fix 刪除約 −0.6 到 +2.1（讀圖），而報告沒給各指標的基準率，無從判斷區間算寬還是窄。「明確回退」那一列的區間下緣在讀圖上與 0 重疊，屬臨界。90 天的觀察窗也看不到長期維護成本。","refs":["fig4","G2"],"nums":[["90 days","S4:fig4"]],"read":["2","1.9","0.6","2.1"],"calc":["6"],"anchors":["AI code slop","same coding directory"],"web":"To test for AI code slop"},{"id":"P11","sec":"S4","key":"¶6","p":[9],"type":"cause","src":["out","tele"],"grade":"A","self":true,"zh":"改看工程師採用第一個「全自主」agent 的前後：採用者在採用前就已處於陡升軌跡——轉向全自主 agent 的人，本來就在加速產出。","note":"讀圖：採用前第四個月約 −0.43、第三個月 −0.37、第二個月 −0.22 對數點，信賴區間都不含 0。從採用前第四個月到採用當月總共升了約 0.72，其中約 0.43（六成）發生在採用之前（N3）。所以這個面板不能當成 AI 效果的證據——報告自己也這麼說。","refs":["fig4","N3"],"read":["0.43","0.37","0.22"],"calc":["0.72","0.43"],"anchors":["steeply upward trajectory"],"web":"already on a steeply upward trajectory"},{"id":"P12","sec":"S4","key":"¶7","p":[9],"type":"cause","src":["out"],"grade":"C","self":true,"zh":"業務代表自「去年 9 月」（應指 2025 年 9 月）起陸續採用 agent；採用後成交的客戶數增加。作者承認，這可能是「機會多的業務比較會去自動化」的自選效果，也可能是記錄與例行溝通被自動化的結果。","note":"讀圖：採用後第一、二、三個月，每月成交客戶比採用前一個月多約 3.0、5.6、6.6 位，但報告沒給業務原本每月成交幾位客戶，無法換算成百分比。採用前的係數在 0 附近（前第四個月約 −1.2，信賴區間含 0），前趨勢大致平坦；自選問題作者自己點了名，但無法排除。","refs":["fig4","G2"],"read":["3.0","5.6","6.6","1.2"],"anchors":["starting last September","selecting into automation"],"web":"selecting into automation"},{"id":"P13","sec":"S4","key":"¶7","p":[9],"type":"anec","src":["intv"],"grade":"D","zh":"一位客戶經理說，Claude 自動化處理 email 草擬與客戶管理軟體整合，取代了約 20% 原本的工作任務；另一位說省下的時間拿去面對面，接觸的客戶多了 30%。","note":"受訪者自估，不是量測。","refs":[],"nums":["20%","30%"],"anchors":["account executive"],"web":"replacing around 20% of their prior"},{"id":"P14","sec":"S4","key":"¶8","p":[9],"type":"anec","src":["intv"],"grade":"D","zh":"一位 Anthropic 律師用 Claude 建了一系列自動化：掃描風險與機會、分流法律問題、對外文案的法務初審。一位招募人員用 Claude 做人選搜尋、申請追蹤，以及一份原本要「大概幾週」的分析，騰出時間重寫過時的面試題目、見更多應徵者。","note":"對法務讀者最相關的一段，但只是個案描述（見「法務意涵」）。","refs":[],"anchors":["triage legal questions"],"web":"triage legal questions"},{"id":"P15","sec":"S4","key":"¶9","p":[9,10],"type":"desc","src":["hr","tele"],"grade":"B","zh":"描述性地看，把 Claude 用在最複雜任務的職務，初階就業放緩（圖 5）。圖 5 以職務為單位：橫軸是該職務 Claude 任務的複雜度百分位（以 2025 年 10 月到 12 月的 agent 紀錄自動編碼），縱軸是 2026 年 1 月到 7 月初階在職人數的成長（對數點），迴歸線依人數加權。","note":"讀圖：共 32 個職務，21 個的初階人數在半年內增加、2 個持平、9 個減少；加權迴歸線約在第 77 百分位才穿過 0。換句話說，多數職務的初階人數還在長，只是複雜度愈高的職務長得愈慢——依迴歸線，位在第 25 百分位的職務半年內初階人數約翻倍，第 75 百分位約持平（N14）。複雜度在結果期之前量測，避開了反向因果，這是設計上的優點；但沒有其他控制變數，複雜度高的職務可能本來就偏好資深人力。","refs":["fig5","N14","G3"],"read":["32","21","2","9","77"],"anchors":["Descriptively"],"web":"Descriptively, we see junior employment slowing"},{"id":"B1","sec":"S5","key":"¶1","p":[9,10],"type":"anec","src":["intv"],"grade":"D","zh":"大量採用 AI 不只改變就業與生產力，也持續改變工作流程：員工形容公司有一股要盡可能快、凡事用 Claude 的「永恆壓力」，也有人說，這裡一週要完成的事，在別處要三個月。","note":"壓力有被引述，卻沒有任何福祉或倦怠的量化指標（G13）。","refs":["G13"],"anchors":["eternal pressure"],"web":"eternal pressure at Anthropic"},{"id":"B2","sec":"S5","key":"¶1","p":[10],"type":"desc","src":["survey"],"grade":"B","self":true,"zh":"內部調查問「公司的工作流程是否讓你盡可能有生產力」：同意者 2024 年底 44%、2025 年 11 月 58%；2026 年 4 月是 75%，但題目拿掉了「盡可能」，變得比較好答。","note":"可比的只有 44% 到 58%（同一題，多了 14 個百分點，N8）。75% 換了題目，作者自己標註了，但仍放在同一句，讀者很容易把三個數字連成一條線。","refs":["N8"],"nums":["44%","58%","75%"],"calc":["14"],"anchors":["as possible"],"web":"44% of employees agreed in late 2024"},{"id":"B3","sec":"S5","key":"¶1","p":[10],"type":"extrap","src":["survey","ext"],"grade":"C","zh":"截至 8 月，Anthropic 員工預期到 2030 年 AI 能做他們 75% 的工作，其他美國人則是 28%。","note":"這句的連結指向同日發表的〈The AI expectations gap〉，但那篇沒有列進 Works cited。依該頁：員工端是 2026 年 8 月 9 日至 12 日的內部問卷，1,334 人、未加權、用滑桿作答；美國成人端是 Morning Consult 在 8 月 11 日至 23 日做的線上自選樣本，10,980 人、加權，作答是選區間再取中點；兩邊都是平均數。作答格式不同、樣本性質不同，該頁自己列了這些限制，本報告轉述時一個都沒帶。","refs":["lit:gap","G14"],"nums":["75%","28%","2030"],"ext":[["1,334","lit:gap"],["10,980","lit:gap"]],"anchors":["other Americans"],"web":"compared to 28% for other Americans"},{"id":"B4","sec":"S5","key":"¶2","p":[10,11],"type":"meas","src":["tele"],"grade":"C","zh":"每次內部發布新模型，員工就在互動式 coding session 裡挑戰更難的問題。以 Claude 評分器，依深度、範圍、牽涉的系統數評估去識別化 session 的任務難度：超過舊模型第 90 百分位難度的任務占比上升約 30%（從 10% 到 13%），並在發布後數週維持高檔；簡單端幾乎沒變。","note":"「急升約 30%」是相對增幅，絕對增幅是 3 個百分點（N5）。評分器是 Claude，報告沒說是哪個模型版本、有沒有人工驗證；若評分器就是新模型，「新模型讓任務變難」這個量測就可能有自己評自己的循環性（G4）。","refs":["N5","G4"],"nums":["90th","30%","10%","13%"],"calc":["3"],"anchors":["automated Claude grader"],"web":"from 10% to 13% of all tasks"},{"id":"B5","sec":"S5","key":"¶3","p":[11],"type":"anec","src":["intv"],"grade":"D","zh":"一位工程師把同時應付好幾個 Claude 比作當保母：每個 agent 不分事情輕重，都用同樣急迫的方式要人處理。","note":"","refs":[],"anchors":["babysitting"],"web":"One engineer compared this to babysitting"},{"id":"B6","sec":"S5","key":"¶5","p":[11],"type":"desc","src":["survey"],"grade":"C","zh":"2026 年 4 月調查的開放題（AI 怎麼影響日常工作）：27% 描述 Claude 工具帶來的生產力提升，20% 描述自己的角色從實際做事轉為管理 Claude。","note":"開放題的答案怎麼歸類（人工或 LLM）、多少人作答，報告沒說。","refs":["G3","G4"],"nums":["27%","20%"],"anchors":["open-ended question"],"web":"27% described productivity gains"},{"id":"B7","sec":"S5","key":"¶6","p":[11],"type":"meas","src":["tele"],"grade":"B","zh":"在互動式的多輪 session 裡，agent 大部分時間不是在工作，而是在等：以 session 的牆鐘時間減去 agent 實際工作時間計算閒置，Claude session 約 80% 的時間在等人類輸入。","note":"這是「session 層級」的閒置率，不是「人」的閒置率。一個人同時開好幾個 session 時，每個 session 依定義大多在等——80% 反映的是人的注意力被切成好幾份，正好支持作者的瓶頸論點，但不代表人慢。報告也沒說超過多久的等待會被截掉（圖 2 的工時口徑排除超過 30 分鐘的等待，這裡沒說是否同樣處理）。","refs":["fig2"],"nums":["80%",["30 minutes","S4:fig2"]],"anchors":["wall-clock time"],"web":"around 80% idly waiting for human input"},{"id":"B8","sec":"S5","key":"¶7","p":[11,12],"type":"meas","src":["tele"],"grade":"B","zh":"把互動式 session 的 agent 輸出 token 換算成閱讀時數（每個 token 0.75 個英文字、每分鐘讀 250 字）：技術職能的輸出量過去 6 個月暴增；即使是非技術群組，輸出量也足以占掉半個以上工作週。圖 6 的終點：工程與研究每人每週 424 小時、財會 43、業務 35、其他非工程 27、法務政策與信任 26、行銷與公關 12。","note":"這是把「量」換成直覺單位的示意指標，不是真的有人要讀：工程與研究的 424 小時是一週 40 小時的 10.6 倍。三個讀法上的提醒：六張小圖的縱軸刻度各不相同（工程到 400、行銷只到 12），斜率看起來差不多，量其實差了幾十倍；多數小圖最後一個月急升，例如法務從約 8.4 跳到 26 小時（讀圖），用前一個月計，只有財會與業務超過 20 小時；程式碼與工具呼叫的 token 也被當成英文散文來換算。","refs":["fig6","N6"],"nums":["6 months",["0.75","S5:fig6"],["250","S5:fig6"],["40 hours","S4:fig2"]],"fig":[["424 h","fig6"],["43 h","fig6"],["35 h","fig6"],["27 h","fig6"],["26 h","fig6"],["12 h","fig6"],["400","fig6"]],"read":["8.4"],"calc":["10.6","20"],"anchors":["average human reading speed"],"web":"over half of the work week"},{"id":"B9","sec":"S5","key":"¶8","p":[11],"type":"desc","src":["tele"],"grade":"B","zh":"於是出現另一種工作：寫給 agent 的常設指示，從 2025 年 7 月的「數百份」增加到一年後的 8,500 份。","note":"「常設指示」沒有定義（是 CLAUDE.md 一類的設定檔？skills？）；「數百份」也不精確，若指 200 到 500 份，增幅約 17 到 43 倍（N16）。","refs":["N16","G17"],"nums":["8,500"],"calc":["200","500","17","43"],"anchors":["standing instructions"],"web":"8,500 a year later"},{"id":"B10","sec":"S5","key":"¶8","p":[11,12],"type":"anec","src":["intv"],"grade":"D","zh":"例子：一位工程師設了「agent 幕僚長」來分流 agent 的請求；有人替自己的 Claude 團隊寫績效檢討；招募人員建了整合儀表板，讓 agent 主動揭露問題並啟動行動；一位律師把重心從審閱法律問題，轉為替法律建議做「SEO」——寫出能被（內部客戶的）agent 找到的框架。","note":"律師的例子對法務工作的意涵最大：法務的產出從「答案」變成「可以被 agent 檢索與套用的規則」（見「法務意涵」）。","refs":[],"anchors":["SEO for legal advice"],"web":"SEO for legal advice"},{"id":"B11","sec":"S5","key":"¶9","p":[12],"type":"meas","src":["tele"],"grade":"C","zh":"這類後設工作占一般員工互動式 session 的比重，從 2025 年秋的 10% 升到 2026 年春的 22%；增幅主要來自 agent 管理：替多 agent 執行寫規格、讓一個 agent 審另一個的輸出、監控流程。","note":"以自動編碼器評 2,000 則一行對話摘要。2,000 則若平均分到 12 列乘 2 期，每格只有約 83 則，比例 20% 的 95% 信賴區間約正負 8.6 個百分點（N9，假設值），所以職能之間差幾個百分點不宜過度解讀。圖 7：基礎設施從約 4.7% 升到 29%、開發工具約 4.5% 到 26%，業務幾乎不動（約 14.5% 到 15%）；財務、法務與行銷合併成一組，約 6.4% 到 12%，是最低的一組（起點為讀圖）。","refs":["fig7","N9","N18","G4"],"nums":["10%","22%",["2,000","S5:fig7"]],"fig":[["29%","fig7"],["26%","fig7"],["15%","fig7"],["12%","fig7"]],"read":["4.7","4.5","14.5","6.4"],"calc":["12","2","83","20","95","8.6"],"anchors":["agent management"],"web":"leapt from 10% of the average employee"},{"id":"B12","sec":"S5","key":"¶10","p":[12,13],"type":"anec","src":["intv"],"grade":"C","zh":"儘管 agent 更可靠、監督工具投資很大，人類的信任與問責仍然關鍵：追 bug 愈來愈常挖出需要人類開會、決策、治理才能解的組織性、系統性或技術債問題；一場又一場訪談裡，員工都說面對面協調不可或缺。","note":"","refs":[],"anchors":["human trust and accountability"],"web":"human trust and accountability remains critical"},{"id":"B13","sec":"S5","key":"¶10","p":[13],"type":"desc","src":["cal"],"grade":"B","zh":"依行事曆資料，中位數員工的開會時間比一年前多 20%；部分反映公司成長與轉向會議密集的非技術職，但即使是技術職的個人貢獻者，開會時間也多了 16%。","note":"給了相對增幅，沒給基準時數。技術職個人貢獻者的 16% 排除了職務組成的變化，比全體的 20% 更有說服力。","refs":["G2"],"nums":["20%","16%"],"anchors":["calendar data"],"web":"spends 20% more time in meetings"},{"id":"B14","sec":"S5","key":"¶11","p":[13],"type":"anec","src":["intv"],"grade":"D","zh":"技術與非技術角色的「執行」部分都被自動化了（寫程式、找 bug、記錄進度、草擬 email）。工程師說自己成了 agent 的領導者與管理者；非技術員工說自己做愈來愈多策略性工作——一位受訪者說，原本占 20% 的策略工作變成占 90%。但許多非技術角色的核心執行本身就是人際的：一通業務電話、一場面試、一次跨部門對齊，這些仍屬於人。","note":"","refs":[],"nums":["20%","90%"],"anchors":["remains human"],"web":"becomes 90% of the job"},{"id":"B15","sec":"S5","key":"¶12","p":[14],"type":"desc","src":["comm"],"grade":"B","zh":"agent 擴散到 Slack，最終出現在近一半的活躍公開頻道。","note":"只看公開頻道；agent「出現」的門檻（一則訊息？持續參與？）沒有定義。","refs":["G17"],"anchors":["nearly half of active, public channels"],"web":"nearly half of active, public channels"},{"id":"B16","sec":"S5","key":"¶12","p":[14],"type":"desc","src":["comm"],"grade":"C","zh":"圖 8 以某個大型部門為例，把所有公開頻道裡的人與 agent 依是否在同一討論串互動連成網路：代表 agent 討論串的橘點大量冒出、主導了網路。","note":"A、B 兩張圖沒有標時間點或期間，也沒有任何網路指標的數值（密度、中心性）；而且只有一個部門。視覺印象強，資訊量少（G5）。","refs":["fig8","G5"],"anchors":["single large department"],"web":"orange dots blossom and dominate the network"},{"id":"B17","sec":"S5","key":"¶13","p":[14],"type":"desc","src":["comm"],"grade":"C","zh":"agent 多半出現在專門的 Claude–人類互動頻道，而不是在既有的人類頻道裡大量發言；人類溝通的結構與密度變化不大：該部門人類討論串的人類回覆數維持不變，只是額外疊上 agent 的回覆。agent 是某一位員工的「團隊」，而不是同時連結很多人的樞紐。","note":"結論合理，但沒有給任何數字（回覆數、密度），讀者只能相信。","refs":["G3"],"anchors":["did not replace human interaction"],"web":"Agents did not replace human interaction"},{"id":"B18","sec":"S5","key":"¶14","p":[14,15],"type":"anec","src":["intv"],"grade":"C","zh":"人被迫把工作搬到 agent 看得見的地方：面對面做的決定如果沒留紀錄，agent 就缺少更新目標的關鍵脈絡——例如有人的名字掛在幾個月前一份周邊商品文件上，agent 就一直把 T 恤和馬克杯的請求轉給那個人，即使職責早就變了。在 AI 密集的職場，私下的工作（不留紀錄的會議與私訊）是看不見、令人困惑、而且被勸阻的；一位研究員說，多數組織不是這樣運作，這要求領導者得公開為回饋辯護。","note":"這是報告裡法律意涵最大的一段：「預設公開」與律師－當事人特權的保密前提、營業秘密的「合理保密措施」要件（聯邦 DTSA 與加州法都有）、員工個資的目的限制都有張力（見「法律對照」）。","refs":["G8","law:ustrade","law:ccpa"],"anchors":["agent-visible channels","Claude swag"],"web":"agent-visible channels"},{"id":"H1","sec":"S5","key":"¶15","p":[15],"type":"desc","src":["hire"],"grade":"C","zh":"招募評分卡：用自動編碼器處理 2024 年以來數千名新進人員的面試評語。最明顯的變化，是愈來愈看重候選人是否展現有創意地使用 AI 工具：2024 年，技術職約 5%、非技術職 7% 的評估提到 AI 工具紀錄；到 2026 年，技術職變成三倍、非技術職變成四倍。","note":"報告只給倍數。換算回去約是技術職 15%、非技術職 28%（N4）——即使變成四倍，多數評估仍然沒有提到 AI 工具。編碼器的定義與驗證都沒有揭露。","refs":["N4","G4"],"nums":["5%","7%"],"calc":["15","28"],"anchors":["tripled","quadrupled"],"web":"around 5% of assessments for technical roles"},{"id":"H2","sec":"S5","key":"¶16","p":[15],"type":"desc","src":["hire"],"grade":"C","zh":"更深一層的變化：技術職候選人的評語裡，增幅最大的是對自主性與判斷力的評論；領域專長的討論占比縮小。一位主管說，預期模型會持續「參差不齊」，所以希望團隊成員能跨領域互換。非技術職則是客戶導向與使命認同的評論增加、執行能力的討論減少。","note":"沒有任何占比數字。值得對照的是 Anthropic 自己 6 月的研究（Hitzig 等人）：用 agent 寫程式時，從新手到中等程度的落差最大，再往上的深度專精只多一點點——這和「降低領域專長權重」「少收新手」兩個招募現象方向一致。但那篇的「新手」指的是任務領域的能力，不等於職級上的初階員工；這是兩份文件之間的推論，不是本報告的發現。","refs":["lit:hitzig"],"anchors":["fungible across domains","domain expertise shrank"],"web":"fungible across domains"},{"id":"E1","sec":"S6","key":"¶1","p":[15,16],"type":"extrap","src":[],"grade":"D","zh":"歷史類比：鐵路帶來經理人企業、蒸汽動力帶來工廠、個人電腦帶來新創。LLM 會需要什麼新組織？一種想像是一人新創指揮成群 agent 賺進數十億；另一種是由 AI 天才當執行長、只雇人類去拿移液管做實驗、到國會作證的公司。","note":"","refs":[],"anchors":["managerial corporation"],"web":"personal computers delivered the startup"},{"id":"E2","sec":"S6","key":"¶2","p":[16],"type":"desc","src":["hr"],"grade":"C","zh":"Anthropic 兩者皆非：一年內規模成長為三倍，不再是小新創；也沒有把經營控制權交給模型——從公司策略到團隊決策，都由書面的 Slack 辯論與面對面會議主導，AI agent 參與很少。保持人類工作可見，讓自主 agent 能從最新脈絡推理；指揮 agent 團隊的個人貢獻者，在所需知識與工作相互依賴上更像經理人。","note":"「三倍」是理解全篇占比數字的關鍵分母，卻只在結論段出現一次，而且沒有附數字基礎（G1）。","refs":["N1","G1"],"anchors":["tripled in size"],"web":"It has tripled in size"},{"id":"E3","sec":"S6","key":"¶3","p":[16],"type":"extrap","src":[],"grade":"C","zh":"員工愈來愈把工作看成管理一群 Claude，花更多時間打造自己領域需要的工具；這種實驗意味著員工持續把自己的任務自動化掉。在某些角色，人愈來愈遠離當初養成其技能的第一線工作。agent 跑得很快，人的注意力與判斷成為系統的瓶頸；從業務到法務，員工被期待做更多、不同的事。","note":"這一句點出了「養成斷層」，卻沒有往下談：如果第一線工作是技能的來源，而人不再做第一線工作，下一代的判斷力從哪裡來？Anthropic 2025 年 12 月的內部研究（Huang 等人）已經記錄過工程師對技能萎縮的擔憂。","refs":["lit:huang"],"anchors":["object-level work"],"web":"originally built their skills"},{"id":"E4","sec":"S6","key":"¶4","p":[16],"type":"desc","src":["hr","fin"],"grade":"C","zh":"總結：組織與工作內容的改變，與初階技術職在人數、新進、職缺三個口徑的占比下降同時出現；招募重自主與判斷，不重執行與狹窄專長；整體而言，Anthropic 營收成長相對於就業成長的速度，已超越前一代科技公司早期的高速生產力成長。","note":"「同時出現」是準確的措辭（相關，不是因果）。營收對就業的比較，同樣受 L1 的口徑問題影響。","refs":["L1"],"anchors":["appeared alongside"],"web":"revenue growth relative to its employment growth"},{"id":"E5","sec":"S6","key":"¶5","p":[16],"type":"extrap","src":["ext"],"grade":"C","zh":"把這些模式往前、往外推到整體經濟，意味著 AI 擴散可能帶來勞工被取代的風險；既有研究也發現，AI 原生新創與 AI 採用者的組織更扁平、雇用更少初階員工。","note":"引用核對：Kim & Koning（AI 原生新創規模小 25%、初階與經理人占比各低約 15%、層級約扁平半級）、Ewens & Giroud（採用 AI 後階層變扁平）、Hosseini & Lichtinger（採用生成式 AI 的公司，初階就業相對下降，主因是招募放緩）——三篇都支持報告的轉述（見「文獻」）。","refs":["lit:kim","lit:ewens","lit:hosseini"],"ext":[["25","lit:kim"],["15","lit:kim"]],"anchors":["worker displacement"],"web":"could risk worker displacement"},{"id":"E6","sec":"S6","key":"¶7","p":[17],"type":"meas","src":[],"grade":"-","self":true,"zh":"能從 Anthropic 學到什麼？作者先自我設限：Anthropic 有許多雇用實務無法複製到整體經濟。","note":"","refs":["K0"],"anchors":["cannot be replicated"],"web":"cannot be replicated across the economy"},{"id":"E7","sec":"S6","key":"¶8","p":[17],"type":"norm","src":[],"grade":"D","zh":"第一，廣泛的員工持股讓員工和公司的成功利害一致。作者承認，對估值大漲的公司這是容易擺出的姿態，對很多公司而言共同持股可能不夠、或不可取；但很難想像一種「親勞工的 AI 導入」裡，勞工對成功導入沒有財務上的利益。","note":"報告沒有提出任何持股效果的證據；持股也把員工的薪資與財富集中押在同一家公司。對多數雇主——非上市、估值平平或成長停滯的公司——這個工具根本不存在，作者自己也承認這一點。","refs":[],"anchors":["widespread stock ownership"],"web":"widespread stock ownership gives employees"},{"id":"E8","sec":"S6","key":"¶8","p":[17],"type":"norm","src":[],"grade":"D","zh":"歷史類比：二戰後 1950 年代的勞資協議——汽車工人與鋼鐵工人的工會讓資方保有重組（甚至加重）工作的權力，換取與生產力連動的加薪和完整的福利。作者主張，不論 AI 時代的新協議長什麼樣子，分享導入利益的機制都不可或缺；Anthropic 的員工把自己的專業寫給機器、工作常規不斷被打亂、大量工作變成速讀 AI 的輸出——這些都不是無償的。","note":"類比的機制不一樣：當年的協議靠高組織率的工會「集體」協商取得；報告提出的是「個別」持股。兩者分享利益的方式、談判力量與適用範圍都不同。","refs":[],"nums":["1950s"],"anchors":["United Auto Workers"],"web":"United Auto Workers"},{"id":"E9","sec":"S6","key":"¶9","p":[17],"type":"norm","src":[],"grade":"D","zh":"第二，Anthropic 正在建立持續運作的預警系統，監測面臨 AI 轉型的職務：用一組職務層級的需求與生產力指標對照 AI 能力與使用，標出工作在哪裡移動，讓公司及早把受影響的員工轉到技能相近、較不立即受衝擊的職務。作者認為，AI 進步愈快，事事都到外部勞動市場找人就愈會成為瓶頸；內部彈性再配置的系統會很關鍵。","note":"支持證據是報告自己的發現（部門間流動增加、工作內容改變）。預警系統的設計、準確度、員工能否得知與申訴，都沒有揭露（G7）。","refs":["G7","L17"],"anchors":["role-level metrics"],"web":"ongoing early warning system"},{"id":"E10","sec":"S6","key":"¶10","p":[18],"type":"norm","src":[],"grade":"-","self":true,"zh":"內部再配置承諾有取捨：運作良好的勞動市場應該把人移到最有生產力的位置，不論在現職公司或別家；承諾再配置現有員工，可能讓雇主不敢冒險雇用新人；在正常、尤其是競爭激烈的經濟環境下，這類承諾可能很昂貴。","note":"這一段和報告的核心發現直接衝突：最受影響的正是新人（初階）。作者自己點出了「保護在職者，雇主就更不敢雇新人」的機制，卻仍把它列為建議（見「政策評析」）。","refs":[],"anchors":["hesitant to take a risk"],"web":"hesitant to take a risk on hiring"},{"id":"E11","sec":"S6","key":"¶11","p":[18],"type":"norm","src":["ext"],"grade":"D","zh":"但優先再配置會迫使採用 AI 的公司思考 AI 如何為新產品、新市場創造新任務，而不是只拿 AI 替代人力省成本；這有助抗拒「平庸」或「無效率」的自動化——AI 只勉強勝過人，雇主就把人換掉，被取代者承受龐大的所得損失，生產力卻只多一點點。","note":"理論依據是 Acemoglu & Restrepo 的取代效果與恢復效果：自動化把任務從人移給資本（取代），新任務把工作帶回給人（恢復）。報告把「再配置承諾」當成推動恢復效果的組織機制——這是有意思的連結，但報告沒有證據顯示它在 Anthropic 確實催生了新任務。","refs":["lit:acemoglu","lit:beraja"],"anchors":["so-so","inefficient"],"web":"create new tasks for new products"},{"id":"E12","sec":"S6","key":"¶12","p":[18],"type":"norm","src":["intv"],"grade":"D","zh":"從 Anthropic 的經驗看，新穎的任務與持續屬於人的任務，都與密集的 AI 使用並存；未來的任務組合不確定，應該保留有彈性的人力。一位 Anthropic 高階主管說，焦慮擔憂的員工不會拿出最好的表現。","note":"報告宣告「三項特徵」，卻只編號到「第二」，網頁版也一樣；依上下文，第三項最可能是這裡的「保留彈性人力／內部再配置承諾」（G6）。","refs":["G6"],"anchors":["flexible workforce"],"web":"preserving a flexible workforce"},{"id":"E13","sec":"S6","key":"¶13","p":[18],"type":"norm","src":[],"grade":"-","self":true,"zh":"這些作為都擋不住強大的 AI 衝擊工作，也都沒有直接處理本報告記錄的初階招募放緩——對在職者的就業保障，幫不到一開始就沒被雇用的人。雇主的私人行動必須搭配有遠見的政府政策（再訓練與所得支持），並以清楚的職場轉型規模為依據。","note":"「再訓練」的連結指向 Roodman & Massenkoff 的證據回顧：56 個美國隨機試驗的結論是效果「正向但有限」——每提供一個訓練名額，就業率約提高二到三個百分點、年收入約多 1,000 美元，成本約 13,000 美元；若 AI 大規模取代勞工，現有的再訓練計畫很可能不夠。報告只放了一個連結字，沒有把這個保守的結論帶進來（見「文獻」）。","refs":["lit:roodman"],"ext":[["56","lit:roodman"],["1,000","lit:roodman"],["13,000","lit:roodman"]],"anchors":["not hired to begin with"],"web":"not benefit those not hired"}],"figs":[{"id":"fig1","n":1,"p":4,"sec":"S3","title_en":"Decline of entry-level technical hiring at Anthropic","zh":"初階技術職招募下降","what":"兩個面板（技術部門、非技術部門），各三條線：在職人數、新進、職缺之中「初階」所占的比例。按月，從 2025 年 3 月到 2026 年 6 月左右；沒有圖註。","printed":[["14%","技術・在職人數（終點）"],["9%","技術・新進（終點）"],["6%","技術・職缺（終點）"],["26%","非技術・新進（終點）"],["25%","非技術・在職人數（終點）"],["13%","非技術・職缺（終點）"]],"read":[["21","技術・在職人數，2025 年 3 月（與內文 21% 相符）"],["27.6","技術・新進，2025 年 5 月（新進線起點）"],["10.7","技術・職缺，2025 年 3 月"],["21.4","技術・職缺高點，2025 年 11 月"],["31.5","非技術・職缺，2025 年 3 月"],["16.1","非技術・職缺，2025 年 11 月"],["22.8","非技術・在職人數，2025 年 3 月"],["31.1","非技術・新進，2025 年 5 月"]],"shows":["技術部門的初階占比在三個口徑都下降，職缺最晚開始降、也降得最急（2025 年 11 月之後）。","非技術部門的初階在職與新進占比，大致持平在四分之一左右。"],"limits":["畫的是占比，不是人數；同一時期公司規模約成長為三倍（N1）。圖題說「入門級技術招募下降」，嚴格說是「占比下降」。","非技術部門的初階職缺占比從約 31.5% 降到 13%，而且大部分降在 2025 年——內文完全沒討論（G9、N13）。","「junior」怎麼界定（職級？年資？）沒有說明（G17）。"],"chart":{"kind":"slope","unit":"%","rows":[["技術・在職人數",21.0,14.0,"tech"],["技術・新進",27.6,9.0,"tech"],["技術・職缺",10.7,6.0,"tech"],["非技術・在職人數",22.8,25.0,"non"],["非技術・新進",31.1,26.0,"non"],["非技術・職缺",31.5,13.0,"non"]],"start":"起點（2025 年 3 月；新進線為 5 月）","end":"終點（2026 年 6 月左右）"},"claims":["L5","L6","L7"]},{"id":"fig2","n":2,"p":6,"sec":"S4","title_en":"Agent hours overtake human hours","zh":"agent 工時超過人類工時","what":"對數縱軸：每一個人類工時對應幾個 agent 工時。兩條線：研究組織、全體員工；2026 年 2 月到 8 月下旬。圖註：只含員工發動的互動式 session，子 agent 合併計算；agent 工時含推論與工具執行，但排除超過 30 分鐘的等待；人類工時以人數乘每週 40 小時計。","nums":[["30 minutes","S4:fig2"],["40 hours","S4:fig2"]],"printed":[["19×","研究組織（終點）"],["6×","全體員工（終點）"]],"read":[["0.13","全體員工，2026 年 2 月初"],["0.2","研究組織，2026 年 2 月初"],["5 月初","全體員工越過平價線"],["4 月初","研究組織越過平價線"]],"shows":["半年多一點，比值成長了數十倍（全體員工約從 0.13 到 6，約 46 倍；N11）。","研究組織的比值約是全體的三倍。"],"limits":["口徑只含互動式 session；內文說自主式加互動式在 3 月就超過人類工時，那個數字沒有圖（P1）。","分母是假設值（每週 40 小時）；平行子 agent 的時間相加；一個 agent 小時不等於一個人類小時的工作量（N7）。"],"calc":["46"],"claims":["K1","I1","P1","P3"]},{"id":"fi 法務與行銷",6.4,12],["資料科學",14.9,19],["其他技術",22.3,24],["業務",14.5,15]],"a":"2025 年 8 月至 10 月（讀圖）","b":"2026 年 4 月至 6 月（圖內標示）","note":"依增幅排序"},"calc":["12","2"],"claims":["K3","B11"]},{"id":"fig8","n":8,"p":14,"sec":"S5","title_en":"Agents come to the communication network","zh":"agent 進入溝通網路","what":"兩張網路圖 A、B：藍點是員工、橘點是 agent 討論串；連線代表在同一討論串裡互動。單一大型部門的公開頻道。","printed":[],"read":[],"shows":["agent 討論串從零星到大量出現，在視覺上主導了網路。"],"limits":["A、B 沒有標時間點或期間（G5）。","沒有任何網路統計量（節點數、密度、中心性）。","只有一個部門，部門怎麼挑的沒說。"],"claims":["B15","B16","B17"]}],"calcs":[{"id":"N1","title":"占比下降，人數不一定下降","inputs":"技術部門初階占比 21% 降到 14%（L5）；技術部門占全公司 61% 降到 56%（L8）；公司一年內規模成長為三倍（E2）。","formula":"初階技術員工人數的倍數 ＝ 全公司人數倍數 G × (56 ÷ 61) × (14 ÷ 21) ＝ G × 0.612","result":"G 為 3 時約 1.84 倍；G 為 2 時約 1.22 倍。損益兩平的 G 約 1.63——只要公司人數成長超過約 1.63 倍，初階技術員工的絕對人數就是增加的。","reading":"報告問「哪些工作不見了？」，但依它自己的數字，不見的是「照舊比例本來會有的」初階職位，不是原本在職的初階員工。這不減損占比下降的意義，只是讀者不該把「占比下降」讀成「初階人數減少」。","caveat":"三個數字的期間不完全對齊：21% 到 14% 是「自 2025 年初」，61% 到 56% 與「三倍」是「過去一年」。這是示意，不是報告的數字。","refs":["L5","L8","E2","G1"],"nums":[["21%","S3:¶4"],["14%","S3:¶4"],["61%","S3:¶5"],["56%","S3:¶5"]],"calc":["3","0.612","1.84","2","1.22","1.63"],"chart":{"kind":"scenario","rows":[["人數不變",1.0,0.61],["損益兩平",1.63,1.0],["成長為 2 倍",2.0,1.22],["成長為 3 倍",3.0,1.84]],"ref":1.0}},{"id":"N2","title":"新進占比 27% 到 9%：初階新進人數是增是減？","inputs":"初階技術職新進占比 27% 降到 9%（L6）。","formula":"初階新進人數的倍數 ＝ 技術職新進總數的倍數 H × (9 ÷ 27) ＝ H ÷ 3","result":"技術職新進總數要成長到 3 倍，初階新進人數才不減。報告沒給 H，所以無法判斷。","reading":"新進占比是三個口徑裡降得最多的，但也是最無法換算成人數的一個。","caveat":"","refs":["L6","G1"],"nums":[["27%","S3:¶4"],["9%","S3:¶4"]],"calc":["3"]},{"id":"N3","title":"對數點換算成倍數（圖 4）","inputs":"工程師新增程式碼：採用當月約 +0.98、第一個月 +1.31、第二個月 +1.85、第三個月 +1.01 對數點；全自主面板：採用前第四個月約 −0.43、採用當月 +0.29（皆讀圖）。","formula":"倍數 ＝ e 的（對數點）次方。假設縱軸是自然對數差：刻度從 −1 到 3，若單位是百分之一，+1.85 只代表多 1.85%，與「急升」的描述不符。","result":"工程師面板約 2.7、3.7、6.4、2.7 倍。全自主面板從採用前第四個月到採用當月共升 0.72，其中 0.43（約 60%）發生在採用之前。","reading":"工程師面板的效果很大，但要記得結果變數是「新增程式碼」；全自主面板的上升大部分在採用前，不能當效果讀。","caveat":"讀圖誤差約正負 0.03 對數點。","refs":["P9","P11","fig4"],"read":["0.98","1.31","1.85","1.01","0.43","0.29","1","3"],"calc":["2.7","3.7","6.4","0.72","60","0.03"]},{"id":"N4","title":"提到 AI 工具的面試評估，還原成比例","inputs":"2024 年技術職約 5%、非技術職 7% 的評估提到 AI 工具紀錄；到 2026 年分別變成三倍、四倍（H1）。","formula":"5% × 3；7% × 4","result":"技術職約 15%、非技術職約 28%。","reading":"倍數聽起來很大，比例仍然是少數：到 2026 年，多數面試評估還是沒有提到 AI 工具。","caveat":"原文寫「約 5%」，推得值也是約數。","refs":["H1"],"nums":[["5%","S5:¶15"],["7%","S5:¶15"]],"calc":["3","4","15","28"]},{"id":"N5","title":"「急升 30%」是幾個百分點？","inputs":"超過舊模型第 90 百分位難度的任務占比，從 10% 升到 13%（B4）。","formula":"絕對：13 − 10；相對：(13 − 10) ÷ 10","result":"絕對增加 3 個百分點，相對增加 30%。","reading":"報告用相對數字形容「急升」。兩個都對，但 3 個百分點聽起來和 30% 很不一樣。","caveat":"","refs":["B4"],"nums":[["10%","S5:¶2"],["13%","S5:¶2"],["30%","S5:¶2"]],"calc":["3"]},{"id":"N6","title":"「讀完要半個工作週」對最後一個月有多敏感","inputs":"圖 6 各群組最後一個月（圖內標示）與前一個月（讀圖）的每人每週閱讀時數；工作週以 40 小時計（圖 2 註的假設）。","formula":"時數 ÷ 40；以 20 小時（半週）為門檻計數","result":"最後一個月：工程與研究 424 小時（10.6 週）、財會 43、業務 35、其他非工程 27、法務政策與信任 26、行銷與公關 12——5 個非技術群組中 4 組超過 20 小時。前一個月：財會約 36、業務約 24、其他非工程約 16、法務約 8.4、行銷約 6.0——只有 2 組超過。","reading":"報告「即使非技術員工也要半個工作週」的說法，主要靠最後一個月的急升。方向沒問題（量確實在暴增），但「半週」這個門檻不穩。","caveat":"前一個月的數值是讀圖；圖 6 各小圖的縱軸刻度不同，讀圖誤差隨刻度放大。","refs":["K3","B8","fig6"],"nums":[["40 hours","S4:fig2"]],"fig":[["424 h","fig6"],["43 h","fig6"],["35 h","fig6"],["27 h","fig6"],["26 h","fig6"],["12 h","fig6"]],"read":["36","24","16","8.4","6.0"],"calc":["10.6","20","5","4","2"]},{"id":"N7","title":"6 倍的分母是假設值","inputs":"agent 工時是人類的 6 倍；人類工時以人數乘每週 40 小時計（P3、圖 2 註）。","formula":"比值 ＝ 6 × 40 ÷ 實際每週工時 h","result":"h 為 45 時約 5.3 倍、50 時 4.8 倍、60 時 4.0 倍。","reading":"方向不變（agent 工時遠超過人），倍數取決於一個沒有量測的假設。分子那一端，平行子 agent 的時間相加、一個 agent 小時不等於一個人類小時，兩者也都會推高比值。","caveat":"","refs":["P3","K1","fig2"],"nums":[["6 times","S4:¶1"],["40 hours","S4:fig2"]],"calc":["45","5.3","50","4.8","60","4.0"]},{"id":"N8","title":"生產力調查的三個數字只有兩個能接起來","inputs":"2024 年底 44%、2025 年 11 月 58%、2026 年 4 月 75%（題目刪掉「盡可能」）（B2）。","formula":"同題比較：58 − 44","result":"同一題增加 14 個百分點；75% 是不同的題目，不能接在後面。","reading":"作者自己標註了換題，這是誠實的；但放在同一句裡，讀者很容易把三個點連成一條線。","caveat":"","refs":["B2"],"nums":[["44%","S5:¶1"],["58%","S5:¶1"],["75%","S5:¶1"]],"calc":["14"]},{"id":"N9","title":"後設工作的比例，每格有多少樣本？","inputs":"自動編碼器評估 2,000 則一行對話摘要（圖 7 註）；圖 7 有 12 列、2 期。","formula":"每格樣本 ＝ 2,000 ÷ (12 × 2)；比例 p 的 95% 信賴區間半寬 ＝ 1.96 × √(p × (1 − p) ÷ n)","result":"若 2,000 則平均分到 24 格，每格約 83 則；p 為 0.2 時，半寬約 8.6 個百分點。若 2,000 則是「每一期」各 2,000 則，每格約 167 則，半寬約 6.1 個百分點。","reading":"不論哪一種讀法，職能之間差幾個百分點都在誤差範圍內；圖 7 的排序只能看大方向。","caveat":"假設樣本平均分配、簡單隨機抽樣；報告沒說 2,000 則是總數還是每期，也沒說怎麼分層。","refs":["B11","fig7","G3"],"nums":[["2,000","S5:fig7"]],"calc":["12","2","24","83","0.2","95","1.96","1","8.6","167","6.1"]},{"id":"N10","title":"「跨部門移動機率高 50%」的量級","inputs":"在職滿一年的員工，2026 年每月跨部門移動的機率比 2025 年高 50%（L17）。","formula":"新機率 ＝ 基準機率 × 1.5","result":"示意：基準每月 1% 會變成 1.5%；基準每月 3% 會變成 4.5%。報告沒給基準。","reading":"相對數字無法判斷規模；若基準很低，50% 的增幅在人數上可能很小。","caveat":"1% 與 3% 只是示意值。","refs":["L17","G2"],"nums":[["50%","S3:¶9"]],"calc":["1.5","1","3","4.5"]},{"id":"N11","title":"圖 2：比值成長幾倍、何時越過平價線","inputs":"全體員工約 0.13（2026 年 2 月初，讀圖）到 6（8 月下旬，圖內標示）；研究組織約 0.2 到 19。","formula":"終點 ÷ 起點","result":"全體員工約 46 倍，研究組織約 95 倍。越過平價線：研究組織約 4 月初、全體員工約 5 月初（讀圖）。","reading":"內文說「3 月自主式加互動式工時首度超過人類」，圖 2 只算互動式，所以越線較晚——兩者不矛盾，但自主式那條線沒有畫出來。","caveat":"對數刻度的起點讀圖誤差較大，倍數只取兩位有效數字。","refs":["P1","P3","fig2"],"fig":[["6×","fig2"],["19×","fig2"]],"read":["0.13","0.2"],"calc":["46","95"]},{"id":"N12","title":"圖 3：基期一換，倍數就變","inputs":"commit 指數約 59（2025 年 5 月，讀圖）、100（基期）、510（終點 5.1 倍）；招募人員錄用約 128（2025 年 7 月高點，讀圖）到 140；法務合約約 53（2024 年 9 月，讀圖）到 310。","formula":"終點 ÷ 改用的基期","result":"以 2025 年 5 月為基期，commit 約 8.6 倍；招募人員相對 2025 年 7 月的高點只多約 9%；法務合約相對 2024 年 9 月約 5.8 倍。","reading":"倍數本身取決於從哪一天開始算。報告選在急彎前一刻當基期（2025 年 12 月），讓近半年的加速一目了然，但也讓「5.1 倍」「1.4 倍」看起來像全部的故事。","caveat":"讀圖數值誤差約正負 3 個指數點。","refs":["P5","P6","fig3"],"fig":[["5.1×","fig3"],["1.4×","fig3"],["3.1×","fig3"],["100","fig3"]],"read":["59","128","53"],"calc":["510","140","310","8.6","9","5.8","3"]},{"id":"N13","title":"圖 1：兩個部門的職缺占比","inputs":"技術職缺：起點約 10.7%（2025 年 3 月）、高點約 21.4%（2025 年 11 月）、終點 6%。非技術職缺：起點約 31.5%、2025 年 11 月約 16.1%、終點 13%。","formula":"相對降幅 ＝ (起點 − 終點) ÷ 起點","result":"技術職缺從高點相對下降約 72%；非技術職缺從起點相對下降約 59%，其中大部分（約 31.5% 到 16.1%）發生在 2025 年 3 月到 11 月。","reading":"非技術部門的初階職缺比技術部門更早開始縮，內文沒有提；若把技術部門的變化歸因於 AI coding agent，非技術部門的這段下降需要另外的解釋。","caveat":"起點與高點為讀圖。","refs":["L7","fig1","G9"],"fig":[["6%","fig1"],["13%","fig1"]],"read":["10.7","21.4","31.5","16.1"],"calc":["72","59"]},{"id":"N14","title":"圖 5：迴歸線怎麼讀","inputs":"迴歸線左端約（第 5.3 百分位，1.0 對數點）、右端約（第 94.7 百分位，−0.25）（讀圖）；32 個職務中 21 增、2 平、9 減。","formula":"斜率 ＝ (−0.25 − 1.0) ÷ (94.7 − 5.3)；代入第 25 與第 75 百分位，再取 e 的次方","result":"斜率約每百分位 −0.014 對數點，約在第 77 百分位穿過 0。第 25 百分位約 0.72 對數點（約 2.1 倍）、第 75 百分位約 0.03（約 1.03 倍）。","reading":"這張圖說的是「長得快或慢」，不是「增或減」：複雜度低的職務半年內初階人數約翻倍，複雜度高的約持平，只有最高的那一段是負的。","caveat":"端點與點位都是讀圖；沒有係數與標準誤，無法判斷斜率的不確定性。","refs":["P15","fig5"],"read":["5.3","1.0","94.7","0.25","32","21","2","9"],"calc":["0.014","77","25","0.72","2.1","75","0.03","1.03"]},{"id":"N15","title":"同一人比較的樣本","inputs":"192 名採用者、74 名研究期間都沒採用的工程師（P9）。","formula":"74 ÷ (192 + 74)","result":"共 266 人，對照組約占 28%。","reading":"對照組是「到最後都沒採用」的人，可能是工作性質本來就不太寫程式、或特別抗拒新工具的人；他們的產出趨勢未必能代表採用者「沒採用時」的樣子。","caveat":"","refs":["P9","fig4"],"nums":[["192","S4:¶5"],["74","S4:¶5"]],"calc":["266","28"]},{"id":"N16","title":"常設指示從「數百」到 8,500","inputs":"2025 年 7 月「數百份」，一年後 8,500 份（B9）。","formula":"8,500 ÷ 200；8,500 ÷ 500","result":"若「數百」指 200 到 500 份，增幅約 17 到 43 倍。","reading":"數量的成長很清楚；但「常設指示」沒有定義，無從得知是設定檔、skills 還是其他東西。","caveat":"200 與 500 是假設的區間。","refs":["B9","G17"],"nums":[["8,500","S5:¶8"]],"calc":["200","500","17","43"]},{"id":"N17","title":"非技術員工的 coding session：2 到 90","inputs":"2025 年 8 月每月 2 次，2026 年 5 月 90 次（L11）。","formula":"90 ÷ 2","result":"45 倍。","reading":"如果「每月 2 次」是整個非技術群組的總數，那麼在一家 2024 年以來就新進了數千人的公司裡，這個基期小到任何成長都會變成驚人的倍數；如果是每人每月，2 到 90 才代表使用型態的根本改變。報告沒說是哪一種。","caveat":"","refs":["L11","G17"],"nums":[["2 per month","S3:¶5"],["90","S3:¶5"]],"calc":["45"]},{"id":"N18","title":"圖 7：誰變成了 Claude 的管理者","inputs":"各職能後設工作比重的起點（讀圖）與終點（圖內標示）。","formula":"終點 − 起點（百分點）","result":"基礎設施 +24.3、開發工具 +21.5、模型研究 +14.1、安全研究 +13.8、資安與信任 +13.2、產品工程 +12.9、全部職能 +11.6、其他非技術 +6.7、財務法務行銷 +5.6、資料科學 +4.1、其他技術 +1.7、業務 +0.5。","reading":"「成為 Claude 的管理者」主要是工程端的故事；業務與其他技術幾乎沒變，財務、法務與行銷合計只多約 5.6 個百分點，終點 12% 是全圖最低。","caveat":"終點標示是整數（四捨五入），起點是讀圖；每格樣本小（N9）。","refs":["B11","fig7"],"fig":[["29%","fig7"],["26%","fig7"],["22%","fig7"],["25%","fig7"],["27%","fig7"],["17%","fig7"],["12%","fig7"],["19%","fig7"],["24%","fig7"],["15%","fig7"]],"calc":["24.3","21.5","14.1","13.8","13.2","12.9","11.6","6.7","5.6","4.1","1.7","0.5"]}],"gaps":[{"id":"G1","sev":"高","title":"沒有任何絕對數","body":"總人數、技術人數、初階人數、新進人數、職缺數、營收，全部只給占比、倍數或增幅。","why":"報告最重要的發現（初階占比下降）需要分母才能讀懂；依它自己的數字，初階技術人數很可能是增加的（N1）。","refs":["L5","L6","L9","E2","N1","N2"]},{"id":"G2","sev":"中","title":"沒有基準率","body":"跨部門移動的機率、沒在寫程式的員工比例、程式碼品質各指標、開會時數、業務每月成交數，都只給變化、不給起點。","why":"相對變化在基準很低時意義有限；品質「沒有差異」在基準未知時無法判斷信賴區間算寬還是窄。","refs":["L12","L17","P10","P12","B13","N10"]},{"id":"G3","sev":"高","title":"多數估計沒有不確定性","body":"除了圖 4，沒有任何信賴區間或標準誤；圖 5 沒有係數與 p 值；調查沒有樣本數與回應率；圖 7 沒有每格樣本數；圖 4 沒說用哪種估計式。","why":"讀者無法分辨「差異」與「雜訊」。交錯採用的雙向固定效果在效果異質時有已知偏誤，估計式不明就無從判斷。","refs":["L4","P9","P15","B6","B11","N9"]},{"id":"G4","sev":"高","title":"四處用 LLM 當量尺，沒有揭露驗證","body":"任務難度（Claude 評分器）、後設工作（自動編碼器，2,000 則摘要）、招募評分卡（自動編碼器）、職務的任務複雜度（自動編碼器）。開放題答案怎麼歸類也沒說。","why":"這四個量測撐起了兩個重點發現（後設工作、招募標準改變）與圖 5。用 Claude 評「用 Claude 做的事」，還可能有自己評自己的循環性：若評分器就是新模型，「新模型讓任務變難」的量測就不是獨立的。","refs":["K3","K4","B4","B6","B11","H1","H2","P15"]},{"id":"G5","sev":"低","title":"圖 8 沒有時間、沒有數字","body":"A、B 兩張網路圖沒有標時間點或期間，也沒有節點數、密度、中心性等任何統計量；只有一個部門，部門怎麼挑的沒說。","why":"視覺印象很強，但讀者無從判斷變化的期間與規模。","refs":["B16","fig8"]},{"id":"G6","sev":"低","title":"「三項特徵」只標到第二","body":"§6¶8 宣告「有三項特徵」，接著只有「第一」（員工持股）與「第二」（預警系統）；網頁版也一樣。","why":"依上下文，第三項最可能是「內部再配置承諾／保留彈性人力」（§6¶10–¶12），但這是讀者的推斷，不是報告寫的。","refs":["E7","E9","E10","E12"]},{"id":"G7","sev":"中","title":"預警系統是黑箱","body":"指標有哪些、門檻怎麼訂、誰看得到、員工能不能得知自己的職務被標記、能不能申訴、與個人層級的人事決定有什麼關係，全部沒有揭露。","why":"這是報告推薦給其他雇主的第二項做法，卻無法被評估或複製；若用到個人層級，在其他法域可能有法律意涵（見「法務意涵」）。","refs":["I5","E9"]},{"id":"G8","sev":"中","title":"員工資料的使用沒有交代告知與保護","body":"agent 遙測、行事曆、Slack 網路、面試評分卡、commit 紀錄都做了個人層級的分析；只有任務難度評分提到「去識別化」，其他分析的告知、同意、存取控制或倫理審查都沒有說明。","why":"沒說明不等於沒做。但一份示範「AI 密集組織」的報告，若被其他雇主照著做，資料治理正是最容易被跳過的部分。","refs":["B4","B13","B16","H1","P9"]},{"id":"G9","sev":"中","title":"非技術部門的初階職缺下降沒有討論","body":"圖 1 顯示非技術部門的初階職缺占比從約 31.5% 降到 13%，大部分在 2025 年（N13）；內文只談技術部門。","why":"若技術部門的下降歸因於 coding agent，非技術部門更早開始的下降需要別的解釋；不討論，等於少了一個檢驗歸因的機會。","refs":["L7","fig1","N13"]},{"id":"G10","sev":"中","title":"沒有談離職、資遣與初階員工本身","body":"報告談招募與在職占比，沒有談離職率、資遣、績效淘汰，也沒有追蹤初階員工本身的去向（升遷、轉職、留任）。","why":"「就業怎麼變」的完整圖像需要流出端；只看流入端，無法分辨「少收人」與「留不住人」。","refs":["L5","L17"]},{"id":"G11","sev":"中","title":"算力成本沒有揭露","body":"agent 工時是人類的 6 倍，但這些工時的成本是多少？「每元營收雇用的人比較少」若營收裡含大量算力支出，勞動替代的真實成本並不清楚。","why":"AI 實驗室的營收結構與 2003 年的 Google、2009 年的 Meta 不同；不揭露成本，每人營收的比較就只是部分的圖像。","refs":["L1","P3"]},{"id":"G12","sev":"中","title":"非程式產出沒有品質檢驗","body":"只有程式碼做了品質比較（P10）；合約、成交、錄用、發票的「量」上升，都沒有任何品質或風險指標。","why":"法務「合約 3.1 倍」是吞吐量；對法務讀者來說，沒有品質指標的吞吐量是最危險的 KPI。","refs":["P6","P10"]},{"id":"G13","sev":"低","title":"福祉與工作強度只有引述，沒有量化","body":"報告引述了「永恆的壓力」、照顧一群小孩般的注意力負荷、「焦慮的員工」，手上也有員工調查，卻沒有報告任何倦怠或福祉指標。","why":"工作強度是「AI 讓人更有生產力」的另一面；只有質性描述，讀者無法判斷代價有多大。","refs":["B1","B5","E12"]},{"id":"G14","sev":"低","title":"引用與出處的小瑕疵","body":"p.10 的「75% 對 28%」連到〈The AI expectations gap〉，那篇沒有列入 Works cited；註 1 說 Google、Meta 的數字來自成立 5 年時的 10-K，但兩家當年都還沒上市。","why":"不改變結論，但影響可查核性；第一個還讓讀者錯過了來源頁自己列的可比性限制。","refs":["B3","L1","lit:gap"]},{"id":"G15","sev":"高","title":"利益衝突與無法重製","body":"作者、資料與被研究的工具全都屬於 Anthropic；資料不公開、沒有附錄或程式碼、沒有預先登記，是技術報告而非同儕審查的論文。被研究的組織在模型取得、人才組成、成長速度與持股文化上都是極端個案。","why":"報告的結論同時是產品的行銷素材。報告自己點出了不少限制（七處自承），這提高了可信度，但無法取代外部重製。","refs":["K0","I2","E6"]},{"id":"G16","sev":"低","title":"訪談對象怎麼選沒說","body":"17 場訪談，誰受訪、怎麼挑、涵蓋哪些職能與職級，都沒有說明。","why":"報告的生動例子幾乎都來自訪談；選樣方式決定這些例子能代表多少人。","refs":["I2","P13","P14","B10"]},{"id":"G17","sev":"中","title":"關鍵詞沒有定義","body":"初階（junior）、較低職等（lower band）、技術部門、coding 類 session、常設指示、agent「出現」在頻道的門檻，都沒有操作化定義；非技術員工的 coding session「每月 2 次」連單位（每人或全體）都不清楚。","why":"定義不清，數字就無法和其他研究比較，也無法判斷變化是否來自分類的改變。","refs":["L3","L11","B9","B15","fig1"]},{"id":"G18","sev":"中","title":"各指標的期間不一致","body":"「自 2025 年初」「過去一年」「截至 2026 年 4 月的一年」「2026 年 1 月到 7 月」「2025 年 8 月到 2026 年 5 月」「2025 年秋到 2026 年春」——每個數字的期間都不同，卻被串成同一個敘事。","why":"把不同期間的變化放在一起，容易造成「同時發生、互為因果」的印象。","refs":["L5","L8","L12","P15","L11","B11"]}],"lit":[{"id":"acemoglu","short":"Acemoglu & Restrepo 2019","cite":"Acemoglu & Restrepo (2019)","title":"Automation and New Tasks: How Technology Displaces and Reinstates Labor","venue":"Journal of Economic Perspectives 33(2): 3–30","kind":"外部・期刊","inworks":true,"used":"p.18，「so-so」自動化","url":"https://doi.org/10.1257/jep.33.2.3","checked":"AEA 文章頁摘要","facts":"以「任務」為單位的架構：自動化讓資本接手原本由人做的任務（取代效果），新任務把工作帶回給人（恢復效果）。","fidelity":"忠實。報告「優先再配置會逼公司去找新任務」的論點，正是這個架構的恢復效果。「so-so」一詞不在摘要裡，本站未核對全文。","verdict":"ok","ext_nums":[]},{"id":"beraja","short":"Beraja & Zorzi 2025","cite":"Beraja & Zorzi (2025)","title":"Inefficient Automation","venue":"Review of Economic Studies 92(1): 69–96","kind":"外部・期刊","inworks":true,"used":"p.18，「inefficient」自動化","url":"https://academic.oup.com/restud/article-abstract/92/1/69/7612958","checked":"未核對（出版社頁面拒絕存取）","facts":"本站只記錄報告怎麼用它：與「so-so」並列，指 AI 只勉強勝過人、被取代者承受重大所得損失、生產力卻只多一點點的自動化。","fidelity":"未核對。","verdict":"unchecked","ext_nums":[]},{"id":"demirer","short":"Demirer 等 2026","cite":"Demirer, Musolff & Yang (2026)","title":"Writing Code vs. Shipping Code: Productivity Effects Across Generations of AI Coding Tools","venue":"NBER Working Paper w35275（2026 年 5 月，9 月修訂）","kind":"外部・工作論文","inworks":true,"used":"p.8，「business impact」","url":"https://www.nber.org/papers/w35275","checked":"NBER 論文頁摘要","facts":"50 萬名以上 GitHub 開發者加上 AI 使用遙測：自動補完、互動式 coding agent、自主式 coding agent 讓 commit 分別累計增加 30%、180%、240%；但沿生產鏈大幅縮水，240% 的效
