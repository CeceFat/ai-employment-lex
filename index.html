ity-Biased Technological Change: Evidence from U.S. Résumé and Job Posting Data","venue":"SSRN 5425555（本站核對 2026-05-06 版）","kind":"外部・工作論文","inworks":true,"used":"p.16，「fewer entry-level」","url":"https://papers.ssrn.com/sol3/papers.cfm?abstract_id=5425555","checked":"作者網站上的 2026-05-06 版 PDF 摘要（SSRN 頁面拒絕存取）","facts":"涵蓋 6,500 萬名勞工、28 萬家以上公司（2015–2025）的履歷資料：公司開始採用生成式 AI 後，初階就業相對未採用者急降，資深就業大致不變；集中在最受生成式 AI 影響的職業，主因是招募放緩而不是離職增加。","fidelity":"忠實。","verdict":"ok","ext_nums":["6,500","28"]},{"id":"huang","short":"Huang 等 2025","cite":"Huang, Seethor, Durmus, Handa, McCain, Stern & Ganguli (2025-12-02)","title":"How AI Is Transforming Work at Anthropic","venue":"Anthropic","kind":"Anthropic 內部","inworks":true,"used":"p.6，「surveying Anthropic engineers」","url":"https://www.anthropic.com/research/how-ai-is-transforming-work-at-anthropic","checked":"Anthropic 網頁","facts":"2025 年 8 月調查 132 名工程師與研究員、53 場深度訪談、20 萬份內部 Claude Code 紀錄：員工自述在 60% 的工作中使用 Claude、生產力提升 50%；Claude 協助的工作有 27% 是原本不會做的事。也記錄了擔憂：深層技能萎縮，以及「比較資淺的人比較少來問我問題」這類指導機會減少的現象。","fidelity":"一致。但它記錄的技能萎縮與指導減少，本報告只在 §6¶3 一句帶過，沒有連到初階的發現。","verdict":"omits","ext_nums":["132","53","20","60","50","27"]},{"id":"kim","short":"Kim & Koning 2026","cite":"Kim & Koning (2026-06-09)","title":"AI-Native Firms","venue":"Harvard Business School Working Paper 26-090","kind":"外部・工作論文","inworks":true,"used":"p.16，「AI-native start-ups」","url":"https://www.hbs.edu/ris/Publication%20Files/26-090_96f92aa0-37d9-4789-beaa-5c0cb87a4032.pdf","checked":"論文 PDF 摘要","facts":"以 Y Combinator 與美國創投支持的新創為樣本：AI 原生公司比同產業同期的非 AI 新創規模小 25%，工程師占比高 13%，初階與經理人占比各低約 15%，層級約扁平半個職級，估值卻相當。","fidelity":"忠實。","verdict":"ok","ext_nums":["25","13","15"]},{"id":"roodman","short":"Roodman & Massenkoff 2026","cite":"Roodman & Massenkoff (2026)","title":"An Evidence Review of Subsidized Job Training","venue":"The Anthropic Institute Working Paper 2026-01","kind":"Anthropic 內部","inworks":true,"used":"p.18，「retraining」","url":"https://www.anthropic.com/research/reviewing-the-evidence-on-worker-retraining-programs","checked":"Anthropic 網頁","facts":"56 個美國隨機試驗的統合分析：職訓的效果正向但有限——每提供一個訓練名額，就業率約提高二到三個百分點、年收入約多 1,000 美元，成本約 13,000 美元；算進稅收與福利支出的節省，大致損益兩平。結論：若 AI 大規模取代勞工，現有的再訓練計畫很可能不夠。","fidelity":"省略了關鍵限定。報告只用一個連結字支持「再訓練」政策，沒有提到自家回顧的結論是現有計畫很可能不夠。Massenkoff 同時是本報告的作者。","verdict":"omits","ext_nums":["56","1,000","13,000"]},{"id":"gap","short":"Sacher 等 2026","cite":"Sacher, Cotter, Jones, Korinek & McCrory (2026-10-16)","title":"The AI Expectations Gap","venue":"The Anthropic Institute","kind":"Anthropic 內部（未列入 Works cited）","inworks":false,"used":"p.10，「75% 對 28%」","url":"https://www.anthropic.com/research/ai-expectations-gap","checked":"Anthropic 網頁","facts":"員工端：2026 年 8 月 9 日至 12 日的內部問卷，1,334 人、未加權、用滑桿作答。美國成人端：Morning Consult 8 月 11 日至 23 日的線上自選樣本，10,980 人、加權；這一題只用有工作的受訪者，作答是選區間再取中點。兩邊都是平均數：員工預期 2030 年 AI 能做 75% 的工作，美國勞工 28%。","fidelity":"未列入 Works cited；轉述時沒有帶任何可比性限制（作答格式、樣本性質都不同，來源頁自己列了這些限制）。McCrory 同時是本報告的作者。","verdict":"omits","ext_nums":["1,334","10,980","75","28"]},{"id":"canaries","short":"Brynjolfsson 等 2026","cite":"Brynjolfsson, Chandar & Chen（2026 年 8 月版）","title":"Canaries in the Coal Mine? Six Facts about the Recent Employment Effects of Artificial Intelligence","venue":"Stanford Digital Economy Lab 工作論文","kind":"外部・工作論文（本報告未引用）","inworks":false,"used":"—（本報告沒有引用）","url":"https://digitaleconomy.stanford.edu/publications/canaries-in-the-coal-mine","checked":"Stanford 網站上的 PDF 摘要（2026 年 8 月版）","facts":"ADP 薪資資料到 2026 年 6 月：沒有證據顯示全面性的就業流失；但 AI 高曝露職業裡 22 到 25 歲的年輕勞工，就業比照低曝露同儕的走勢少了 19%，資深勞工沒有類似落差；主要經由減少雇用年輕人，而不是增加離職。作者強調這是描述性的早期指標，不是因果估計。","fidelity":"與本報告的初階發現高度相關、而且是外部的大樣本資料，本報告沒有引用。","verdict":"missing","ext_nums":["22","25","19"]}],"law":[{"id":"atwill","juris":"加州","name":"California Labor Code §2922","short":"at-will 雇用","url":"https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=LAB&sectionNum=2922","text":"An employment, having no specified term, may be terminated at the will of either party on notice to the other.","zh":"未定期限的雇用，任一方得通知對方後隨時終止。","maps":["E9","E10","E12","I5"],"note":"這是讀懂報告政策段的前提。在 at-will 制度下，雇主沒有法定的轉調或安置義務；Anthropic「優先內部轉調」是自願承諾，隨時可以改變。報告擔心「再配置承諾會讓雇主不敢雇新人」，正是因為這種承諾在美國沒有法律強制、要靠雇主自己扛成本。反過來說，承諾的可信度也只能靠公司自己——除非承諾寫進契約或形成默示契約，員工通常沒有法律上的請求權。"},{"id":"warn","juris":"聯邦／加州","name":"29 U.S.C. §2102(a)；California Labor Code §1401(a)","short":"大量資遣 60 天預告","url":"https://www.law.cornell.edu/uscode/text/29/2102","text":"An employer shall not order a plant closing or mass layoff until the end of a 60-day period after the employer serves written notice of such an order— （加州 §1401(a)：An employer may not order a mass layoff, relocation, or termination at a covered establishment unless, 60 days before the order takes effect, the employer gives written notice of the order …）","zh":"雇主在送達書面通知滿 60 天前，不得下令關廠或大量資遣（聯邦 WARN）；加州版要求大量資遣、遷移或終止營運前 60 天書面通知受影響員工與主管機關。","maps":["E13","E9"],"note":"美國法對 AI 導致的組織調整，管的是「程序」（大量資遣前要預告），不是「實體」（不要求先轉調）。所以報告推薦的內部再配置，是在法律最低要求之上的選擇；若沒有做到，法律能提供的只是 60 天的預告期。"},{"id":"ccpa","juris":"加州","name":"California Civil Code §1798.100(a)(1)、(c)；§1798.145(m)(4)","short":"員工個資：告知、目的限制、比例原則","url":"https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=CIV&sectionNum=1798.100","text":"(c) A business’ collection, use, retention, and sharing of a consumer’s personal information shall be reasonably necessary and proportionate to achieve the purposes for which the personal information was collected or processed, or for another disclosed purpose that is compatible with the context in which the personal information was collected …（§1798.145(m) 的員工資料豁免：This subdivision shall become inoperative on January 1, 2023.）","zh":"企業蒐集、使用、保存與分享個資，必須為達成蒐集目的（或與蒐集脈絡相容的已揭露目的）所合理必要且合乎比例；並須在蒐集時或之前告知蒐集的類別與目的。原本對員工與求職者資料的豁免，已於 2023 年 1 月 1 日失效。","maps":["G8","B13","B16","P9","H1","E9"],"note":"報告的研究方法對員工資料做了個人層級的分析：agent 遙測、行事曆、Slack 網路、面試評分卡、commit 紀錄。在加州，這些都是 CCPA 下的員工個資，要回答兩個問題：蒐集時告知的目的是否涵蓋「職務預警」「勞動經濟研究」這類用途；這樣的使用是否合理必要且合乎比例。報告沒有交代（G8），沒交代不等於沒做，但想仿效的雇主一定要先做這一步。"},{"id":"admt","juris":"加州","name":"Cal. Code Regs. tit. 11, §7001(e)、§7001(ddd)(4)、§7200（加州隱私保護局 ADMT 規則）","short":"自動化決策用於工作分派","url":"https://cppa.ca.gov/regulations/ccpa_updates.html","text":"“Automated decisionmaking technology” or “ADMT” means any technology that processes personal information and uses computation to replace human decisionmaking or substantially replace human decisionmaking. … “Employment or independent contracting opportunities or compensation” means: (A) Hiring; (B) Allocation or assignment of work for employees … (C) Promotion; and (D) Demotion, suspension, and termination.","zh":"ADMT 指處理個資、以運算取代或實質取代人類決策的技術；「實質取代」指沒有人類參與就依技術產出做決定（人類參與須能解讀產出、審查分析、並有權改變決定）。「重大決定」包括雇用：錄用、工作分派與報酬、升遷、降調停職與終止。規則自 2026 年 1 月 1 日生效；在 2027 年 1 月 1 日前已用 ADMT 做重大決定者，須於該日前合規（事前告知、選擇退出、查詢權等）。","maps":["E9","I5","H1","G7"],"note":"報告描述的預警系統是「職務層級的指標，供公司決定把人轉到哪裡」。只要最後的轉調決定有實質的人類審查，就不屬於 ADMT；但若系統的產出被直接拿來分派個人的工作，就落入「工作分派」這個重大決定類別，要給員工事前告知（§7220），原則上也要提供選擇退出（§7221，有例外）。報告沒有揭露系統設計（G7），所以無法判斷落在哪一邊——這正是想仿效的雇主要先設計清楚的地方。"},{"id":"feha","juris":"加州","name":"加州民權委員會「自動化決策系統」雇用規則（FEHA，2025 年 10 月 1 日生效）","short":"AI 用於雇用決定的歧視風險","url":"https://calcivilrights.ca.gov/2025/06/30/civil-rights-council-secures-approval-for-regulations-to-protect-against-employment-discrimination-related-to-artificial-intelligence/","text":"Make it clear that the use of an automated-decision system may violate California law if it harms applicants or employees based on protected characteristics, such as gender, race, or disability. Ensure employers and covered entities maintain employment records, including automated-decision data, for a minimum of four years.","zh":"（官方新聞稿對規則重點的說明）使用自動化決策系統若因性別、種族、身心障礙等受保護特徵而損害求職者或員工，可能違反加州法；雇主須保存雇用紀錄（包括自動化決策資料）至少四年。規則於 2025 年 6 月 27 日核定、10 月 1 日生效。","maps":["H1","H2","K4"],"note":"報告用自動編碼器分析面試評分卡，是「研究」用途，不是拿來做錄取決定。但報告的訊息是「招募標準正在轉向自主、判斷與 AI 工具使用」；雇主若把這套編碼直接用在甄選上，就進入這套規則的範圍，要能說明它不會對受保護群體造成不利影響，並保存相關資料。"},{"id":"nyc144","juris":"紐約市","name":"New York City Local Law 144 of 2021（自動化雇用決策工具）","short":"AEDT 的偏誤稽核與通知","url":"https://www.nyc.gov/site/dca/about/automated-employment-decision-tools.page","text":"Local Law 144 of 2021 regarding automated employment decision tools (“AEDT”) prohibits employers and employment agencies from using an automated employment decision tool unless the tool has been subject to a bias audit within one year of the use of the tool, information about the bias audit is publicly available, and certain notices have been provided to employees or job candidates.","zh":"雇主使用自動化雇用決策工具，須在使用前一年內完成偏誤稽核、公開稽核資訊，並通知員工或求職者；主管機關自 2023 年 7 月 5 日起執法。","maps":["H1","H2"],"note":"Anthropic 在紐約有大量職缺。同上：報告的評分卡編碼是研究用途；但若被用來實質協助錄取或升遷決定、而對象是紐約市的求職者或員工，就要先做偏誤稽核並通知。"},{"id":"ustrade","juris":"聯邦／加州","name":"18 U.S.C. §1839(3)(A)（DTSA）；California Civil Code §3426.1(d)(2)（CUTSA）","short":"營業秘密的合理保密措施","url":"https://www.law.cornell.edu/uscode/text/18/1839","text":"(A) the owner thereof has taken reasonable measures to keep such information secret; …（加州：Is the subject of efforts that are reasonable under the circumstances to maintain its secrecy.）","zh":"資訊要受營業秘密保護，所有人必須已採取合理措施保持其秘密性（聯邦）；加州的要件是「已就具體情況採取合理的保密努力」。","maps":["B18","E2"],"note":"報告把「預設公開、讓 agent 看得見」描寫成 AI 密集組織運作的條件。資訊放在廣泛公開的內部頻道、被大量 agent 讀取，若沒有依「需要知悉」分級，日後主張營業秘密時，「合理保密措施」會比較難證明。同樣的邏輯也適用於律師與當事人間的特權：特權以保密為前提，法律意見在內部被廣泛散布、超出需要知悉的範圍，可能動搖特權主張（視具體事實而定）。這是本站的延伸觀察，報告沒有討論。"},{"id":"taa","juris":"聯邦","name":"Trade Act of 1974 §285(a)（Trade Adjustment Assistance）","short":"聯邦轉業調整方案的現況","url":"https://www.dol.gov/agencies/eta/tradeact","text":"On July 1, 2022, the termination provision under Section 285(a) of the Trade Act of 1974, as amended, took effect. Until further notice, the Department may not issue any determinations and may not accept any new petitions or requests for reconsideration.","zh":"（美國勞工部公告）自 2022 年 7 月 1 日起，貿易調整援助方案的終止條款生效；在另行通知前，勞工部不得作成認定，也不受理新的申請。","maps":["E13"],"note":"報告最後呼籲「有遠見的政府政策（再訓練與所得支持）」。美國過去針對特定原因失業者最完整的轉業方案是 TAA（因貿易失業），它從 2022 年起已停止受理新案；就本站查到的範圍，沒有一個針對「因 AI 或技術而失業」、現成運作中的專門調整方案。報告自己連結的證據回顧又指出，一般性職訓的效果有限（Roodman & Massenkoff）。所以報告呼籲的政策，在美國幾乎要從頭建構。"},{"id":"euaia","juris":"歐盟","name":"歐盟人工智慧法附件 III 第 4 點","short":"雇用領域的高風險 AI（歐盟據點）","url":"https://artificialintelligenceact.eu/annex/3/","text":"(a) AI systems intended to be used for the recruitment or selection of natural persons, in particular to place targeted job advertisements, to analyse and filter job applications, and to evaluate candidates; (b) AI systems intended to be used to make decisions affecting terms of work-related relationships, the promotion or termination of work-related contractual relationships, to allocate tasks based on individual behaviour or personal traits or characteristics or to monitor and evaluate the performance and behaviour of persons in such relationships.","zh":"（a）用於招募或甄選自然人的 AI 系統；（b）用於作成影響勞動關係條件、升遷或終止之決定，依個人行為或特質分派任務，或監測評估人員表現與行為的 AI 系統。","maps":["E9","H1","G7"],"note":"Anthropic 在都柏林、慕尼黑、巴黎也有職缺，報告的資料沒有分國別。若預警系統或評分卡編碼用在歐盟據點員工的個人層級決定，就屬於高風險 AI 的類別，另有 GDPR 的資料保護要求。"},{"id":"tw","chip":"台灣移植提醒","juris":"台灣（移植提醒）","name":"若台灣企業仿效：勞動基準法第 11 條第 4 款等","short":"不是本案準據法","url":"https://law.moj.gov.tw/LawClass/LawSingle.aspx?pcode=N0030001&flno=11","text":"勞動基準法第 11 條第 4 款：業務性質變更，有減少勞工之必要，又無適當工作可供安置時。（最高法院 114 年度台上字第 766 號民事判決：雇主資遣勞工前必先盡「安置前置義務」，必無處可供安置時，最後不得已才可資遣。）","zh":"","maps":["E9","E10"],"note":"這一則不是用來評價 Anthropic——它的雇用關係不受台灣法規範。放在這裡，是因為報告把做法推薦給「整體經濟」的雇主，台灣讀者會想知道照搬時的差異。最大的差異在第三項建議：美國是 at-will，內部再配置是自願承諾；台灣的資遣門檻本身就要求雇主先在既有的適當職缺安置（但不必另創新職位），AI 帶來的技術變更可以構成「業務性質變更」（最高法院 98 年度台上字第 652 號）。其他差異：利益分享可以接《公司法》第 235 條之 1 的員工酬勞（連動獲利，不是生產力）；員工資料受《個人資料保護法》第 5 條、第 20 條的目的限制；《人工智慧基本法》第 15 條把弭平技能落差、輔導 AI 致失業者就業列為政府義務。"}],"report":[{"id":"bottom","nav":"結論","title":"結論先講","blocks":[{"t":"p","x":"**描述可信，歸因偏弱，外推要打折。**這份報告用 Anthropic 內部七類資料加上 17 場訪談，記錄了三件事：初階技術職在在職人數、新進、職缺三個口徑的占比同步下降；agent 的用量與人均產出指標急升；面試評語的重心從專長移向自主與判斷。這三件事在描述的層次都站得住。"},{"t":"p","x":"弱的是因果與外推。能說明因果的同一人前後比較，只做了工程師與業務兩種職能 [[P9]] [[P12]]；初階占比下降與 AI 的連結，靠的是主管自評、訪談和一張 32 個職務的散布圖 [[L4]] [[P15]]；而公司一年內規模成為三倍，依報告自己的數字試算，初階技術員工的絕對人數很可能不減反增（公司成長為三倍時約 1.84 倍，期間未完全對齊，屬示意）[[N1]]。Anthropic 在模型取得、人才組成、成長速度與持股文化上都是極端個案，作者也承認許多做法無法複製 [[E6]]。"},{"t":"p","x":"最值得注意的是政策段的內部張力：作者推薦的「內部再配置承諾」，依其自己的說法可能讓雇主更不敢雇新人 [[E10]]——而新人正是報告記錄到受衝擊最大的一群。作者也坦白，這些建議都幫不到一開始就沒被雇用的人 [[E13]]。放在美國法下看，這些承諾全是雇主的自願選擇：at-will 雇用之下，沒有法定的轉調或安置義務 [[law:atwill]]。"},{"t":"stats"}]},{"id":"what","nav":"報告","title":"這份報告是什麼","blocks":[{"t":"p","x":"The Anthropic Institute 於 2026 年 10 月 16 日發表的技術報告，作者 Nathan Wilmers、Regina Catipon、Maxim Massenkoff、Peter McCrory。PDF 共 20 頁、8 張圖、1 個註腳、10 筆引用文獻；網頁版標為「Economics」。它問的問題是：一家站在 AI 採用最前沿的公司，工作與就業被 AI 改成了什麼樣子？"},{"t":"p","x":"資料全部來自 Anthropic 內部：就業紀錄、AI 使用遙測、產出指標、員工調查、內部通訊、行事曆、招募評分卡，外加 17 場員工訪談 [[I2]]。外界無法重製任何一個數字。"},{"t":"h3","x":"本站怎麼讀"},{"t":"ul","items":["逐段拆成 76 則主張，每則標出類型、資料來源與證據等級，附段落座標與「原文定位」連結——點下去會打開 Anthropic 官方網頁並標亮那一句。","報告引用的每個數字，建置時機械核對它確實出現在所標的段落（95 個）；只印在圖上的終點標示以 OCR 核對（81 個）；目測讀圖的數值一律標「讀圖」。","報告引用的 10 筆文獻，加上一筆沒列入文獻表的連結，都回到原頁核對報告的轉述是否忠實（見「文獻」）。","本站自己算的數字（18 項）都寫出公式與假設；報告沒說的事整理成 18 項缺口。","法律對照以美國聯邦與加州法為主——那是 Anthropic 雇用關係的準據法；歐盟據點另註，台灣只列一則移植提醒。"]},{"t":"h3","x":"出處驗證"},{"t":"p","x":"本站分析的 PDF，與 Anthropic 官方網頁「Read in PDF」連結的檔案逐位元相同（伺服器回傳的 MD5 與檔案大小一致，2026-10-19 核對）。網頁版與 PDF 的文字比對：69 個可比段落中 49 段逐字相同，其餘只有排版與潤飾差異，沒有數字或主張不同。"},{"t":"h3","x":"利益衝突揭露"},{"t":"coi"}]},{"id":"kf","nav":"重點","title":"四個重點發現，逐項判定","blocks":[{"t":"p","x":"報告開頭列了四個重點發現。逐項對照本文的證據，判定如下。"},{"t":"verdicts"},{"t":"p","x":"合起來看：四項的描述層全部成立；歸因層只有第二項有部分設計，而且只限兩種職能；第一項沒有主張因果；第三項的後半與第四項，依賴沒有揭露驗證方式的 LLM 編碼。"}]},{"id":"chain","nav":"論證鏈","title":"論證鏈：哪一環最強、哪一環最弱","blocks":[{"t":"p","x":"把報告的論證拆成七個環節，標出每一環的證據強度。實線表示有量測支持，虛線表示主要靠訪談、自評或推論；紅色虛線是報告自己點出的反向作用。"},{"t":"chain"},{"t":"p","x":"最強的一環是「agent 擴散 → 人均產出上升」，但只限工程師與業務兩種職能 [[P9]] [[P12]]。最弱的是「招募標準改變 → 初階占比下降」：報告沒有任何量測直接連起這兩件事，它們只是時間上同時發生——作者在總結段用的詞也正是「同時出現」[[E4]]。"}]},{"id":"reads","nav":"讀法","title":"七個關鍵讀法","blocks":[{"t":"h3","x":"一、占比不是人數"},{"t":"p","x":"報告問「哪些工作不見了？」[[L2]]，接著給了三個占比：技術部門的初階員工 21% 降到 14% [[L5]]、初階新進 27% 降到 9% [[L6]]、技術部門占全公司 61% 降到 56% [[L8]]。但一直到結論段，報告才提到公司「一年內規模成為三倍」[[E2]]。"},{"t":"p","x":"把這幾個數字放在一起：初階技術員工人數的倍數，等於全公司人數的倍數乘以 0.612。公司成長為三倍時，初階技術員工約為原來的 1.84 倍；只要公司人數成長超過約 1.63 倍，初階技術員工的絕對人數就是增加的 [[N1]]。報告自己也說技術招募的絕對數仍在成長 [[L9]]，導論用的詞是「相對」[[I3]]。"},{"t":"p","x":"所以「不見的工作」，是照舊比例本來會有的初階職位，不是被裁掉的人。這仍然是重要的訊號——對初階求職者來說，機會的成長遠遠落後公司的成長——但不該讀成「Anthropic 的初階員工變少了」。"},{"t":"callout","kind":"note","x":"三個數字的期間沒有完全對齊（「自 2025 年初」對「過去一年」），試算是示意，不是報告的數字。"},{"t":"h3","x":"二、因果證據只覆蓋兩種職能"},{"t":"p","x":"作者清楚知道最大的替代解釋：同一期間公司業務爆炸成長，好模型好賣，產出本來就會上升 [[P8]]。他們用「同一人、採用前後、對照同月未採用者」的設計處理，方向是對的。但這個設計只做了兩種職能："},{"t":"ul","items":["工程師的新增程式碼：採用前平坦、採用後大幅上升，讀圖約 2.7 到 6.4 倍 [[P9]] [[N3]]。這是全篇最強的一張證據；限制是結果變數為量，對照組只有 74 人、而且是到最後都沒採用的人 [[N15]]。","業務的成交客戶：採用後上升，但作者自己點了自選問題 [[P12]]。","全自主 agent：採用前就在上升，約六成的升幅發生在採用之前，報告自己說不能當作效果 [[P11]]。"]},{"t":"p","x":"其他職能——包括法務的「合約 3.1 倍」——只有描述性的時間序列 [[P6]]，和公司成長混在一起。重點發現把這兩種強度不同的證據寫在同一句裡 [[K2]]。"},{"t":"h3","x":"三、產出是量，不是價值"},{"t":"p","x":"圖 3 的六條線全是活動量：commit 數、查詢數、處理的合約數、成交數、錄用數、發票數 [[P5]] [[P6]]。報告引用的兩份文件其實都提醒過：Anthropic 自家的 Favaro & Clark 寫到，以程式碼行數計的 8 倍幾乎確定高估了真實的生產力 [[lit:rsi]]；外部的 Demirer 等人發現，自主式 coding agent 讓 commit 增加 240%，傳到實際發布只剩 30% [[lit:demirer]]。"},{"t":"p","x":"基期也會放大倍數。圖 3 以 2025 年 12 月為 100，正好在急彎之前；commit 那條線在基期前已經從約 59 漲到 100，換成以 2025 年 5 月為基期就是約 8.6 倍；招募人員的錄用，相對 2025 年 7 月的高點只多約 9% [[N12]]。"},{"t":"p","x":"程式碼品質的檢驗是例外：同一人、同月、同目錄，比較 agent 寫的與本人寫的程式碼，刪除與回退的比率沒有顯著差異 [[P10]]。設計很好，但「沒有顯著差異」不等於「證明一樣好」，各指標的基準率沒有揭露，觀察窗也只有 90 天。其他職能的產出完全沒有品質指標 [[G12]]。"},{"t":"h3","x":"四、瓶頸的數字是示意"},{"t":"p","x":"「Claude session 約 80% 的時間在等人」[[B7]] 是 session 層級的閒置率。一個人同時開好幾個 session，每個 session 依定義大多在等——這個數字反映的是注意力被切成好幾份，正好支持作者的論點，但不代表人慢。"},{"t":"p","x":"「讀完 agent 的輸出要花半個工作週」[[B8]] 是把 token 換成閱讀時數的示意：工程與研究每人每週 424 小時，是 40 小時工作週的 10.6 倍，沒有人真的會去讀。非技術群組的「半週」也很敏感：用最後一個月算，5 組中 4 組超過 20 小時；用前一個月算，只剩 2 組 [[N6]]。法務、政策與信任這一組，從前一個月的約 8.4 小時跳到 26 小時 [[fig6]]。"},{"t":"h3","x":"五、用 LLM 量 LLM"},{"t":"p","x":"報告有四處用 Claude 或自動編碼器當量尺：任務難度 [[B4]]、後設工作 [[B11]]、招募評分卡 [[H1]]、職務的任務複雜度 [[P15]]。它們撐起了兩個重點發現與圖 5，卻沒有一處揭露驗證方式——人工標註的一致性、評分器的版本、錯誤率都沒有 [[G4]]。"},{"t":"p","x":"任務難度最需要小心：如果評分器就是新發布的模型，「新模型一出，任務就變難」這個量測就不是獨立的。另外，「急升約 30%」是相對值，絕對值是從 10% 到 13%，多了 3 個百分點 [[N5]]。這是 AI 研究常見的「代理指標當真值」問題：LLM 的分類結果是量尺，不是事實本身。"},{"t":"h3","x":"六、極端個案的外推"},{"t":"p","x":"報告的前提是 Anthropic 可以當「領先指標」[[K0]]。要讓這個外推成立，其他企業得在幾個方面趨近 Anthropic："},{"t":"ul","items":["模型取得：員工在新模型內部發布時就用上，任務難度隨著發布跳升 [[B4]]。","人才組成：員工自己預期 2030 年 AI 能做 75% 的工作，美國勞工平均是 28%——這個落差本身就說明了樣本的特殊 [[B3]]。","成長速度：一年內規模成為三倍 [[E2]]。","持股文化：作者自己承認，員工持股對估值大漲的公司是容易擺出的姿態 [[E7]]。"]},{"t":"p","x":"作者在政策段也寫了：許多雇用實務無法複製到整體經濟 [[E6]]。真正能外推的旁證來自外部：Hosseini & Lichtinger 用 6,500 萬名勞工的履歷資料發現，採用生成式 AI 的公司初階就業相對下降，主因是招募放緩 [[lit:hosseini]]；本報告沒有引用的 Brynjolfsson 等人用 ADP 薪資資料發現，AI 高曝露職業裡 22 到 25 歲勞工的就業比照同儕少了 19% [[lit:canaries]]。方向一致，但能外推的是那些研究，不是 Anthropic 本身。"},{"t":"h3","x":"七、政策段的內部張力"},{"t":"p","x":"報告的政策建議宣稱有三項，卻只標到第二項 [[G6]]：員工持股、預警系統，以及從上下文推斷的內部再配置承諾。作者自己寫出了最關鍵的取捨：承諾再配置現有員工，可能讓雇主不敢冒險雇用新人 [[E10]]。"},{"t":"p","x":"把這句和報告的核心發現並排：受衝擊最大的是初階新人；推薦的做法保護的是已經在職的人；而保護在職者的成本，依作者自己的說法，可能由還沒被雇用的人承擔。作者在最後一段承認，這些建議都幫不到一開始就沒被雇用的人，要靠政府的再訓練與所得支持 [[E13]]。但報告為「再訓練」連結的自家證據回顧，結論是現有計畫效果有限，若 AI 大規模取代勞工，很可能不夠 [[lit:roodman]]；而美國過去針對特定原因失業者最完整的轉業調整方案 TAA，從 2022 年起已停止受理新案 [[law:taa]]。"},{"t":"p","x":"報告沒有討論任何企業層級、直接針對初階的做法——例如保留初階名額、結構化的學徒制，或把「帶新人」明訂為 agent 時代的正式工作內容。"}]},{"id":"policy","nav":"政策","title":"政策主張逐項評析","blocks":[{"t":"p","x":"報告推薦給「整體經濟」的雇主三項做法，最後呼籲政府政策。逐項看理由、證據，以及在美國法下的位置。"},{"t":"policy"},{"t":"p","x":"一個關鍵的背景：報告的政策段是在美國 at-will 雇用的框架下寫的。加州法明定未定期限的雇用，任一方得通知後隨時終止 [[law:atwill]]；大量資遣只有 60 天的預告義務 [[law:warn]]，沒有先轉調、先安置的要求。所以「優先內部再配置」在美國是一項自願承諾——雇主願意扛，才存在；除非寫進契約或形成默示契約，員工通常沒有請求權。這也解釋了作者為什麼擔心承諾的成本：它沒有法律強制，只能靠公司自己買單。"}]},{"id":"legal","nav":"法律","title":"法律對照：以美國法為主","blocks":[{"t":"p","x":"報告本身是經濟研究，沒有適用任何法律。但要評估它描述的雇用實務、以及它推薦給雇主的做法，準據法是 Anthropic 雇用關係所在地的法律：Anthropic 總部在舊金山，官方職缺頁（2026-10-19 查詢）的職缺集中在舊金山、紐約、西雅圖。所以下面以美國聯邦法與加州法為主；報告的資料沒有分國別，Anthropic 在倫敦、都柏林、慕尼黑、巴黎、東京、首爾、雪梨等地也有職缺，各依當地法——歐盟另列一則。"},{"t":"callout","kind":"note","x":"條文都回官方來源逐字核對；中文是本站的說明，不是官方翻譯；「對應關係」是本站的判斷。最後一則台灣條文只是移植提醒，不是本案的準據法。"},{"t":"lawcards"}]},{"id":"practice","nav":"法務意涵","title":"對法務與 IP 工作者的意涵","blocks":[{"t":"p","x":"報告裡和法務直接相關的資料點有六個 [[P6]] [[P14]] [[B10]] [[fig6]] [[fig7]] [[E3]]。拆開來看，對法務與智財工作者的意涵如下；這一節是本站的推論，不是報告的主張。"},{"t":"h3","x":"一、工作單位從「答案」變成「給 agent 用的規則」"},{"t":"p","x":"一位 Anthropic 律師把重心從審閱法律問題，轉為替法律建議做「SEO」：寫出能被內部客戶的 agent 找到並套用的框架 [[B10]]；另一位律師用 Claude 做風險掃描、問題分流與對外文案初審 [[P14]]。法務的產出要能被機器檢索、版本化、可稽核——本質上是知識工程。判斷力沒有消失，而是被寫進規則裡；規則寫錯的代價也一起放大。"},{"t":"h3","x":"二、量化法務產出，要配對品質指標"},{"t":"p","x":"「每位法務人員處理的合約 3.1 倍」是吞吐量 [[P6]]：沒有同一人比較、沒有品質指標，而且和公司業務成長混在一起。法務部門若要用 AI 效益說服管理層，吞吐量之外至少要配一個品質或風險指標——例如事後爭議、偏離範本的比例、升級處理率——否則很容易被讀成「法務可以少幾個人」。"},{"t":"h3","x":"三、初階養成的斷層"},{"t":"p","x":"法務與專利的初階工作——初審、分流、檢索、初稿——正是最先被自動化的部分。報告自己寫到，某些角色愈來愈遠離當初養成技能的第一線工作 [[E3]]；Anthropic 去年的內部研究記錄過工程師對技能萎縮的擔憂，也有人說比較資淺的同事比較少來請教了 [[lit:huang]]。如果審閱 AI 輸出所需的判斷力來自第一線經驗，而新人不再有第一線經驗，組織就得刻意設計練習與審閱機制，不能指望自然養成。"},{"t":"h3","x":"四、招募訊號：AI 工具紀錄的權重在上升"},{"t":"p","x":"在 Anthropic，提到 AI 工具紀錄的面試評估變成三到四倍——但還原成比例約 15% 與 28%，多數評估仍然沒有提到 [[H1]] [[N4]]；自主與判斷的權重上升、領域專長下降 [[H2]]。對法務求職者，能具體說明自己怎麼設計 AI 工作流、怎麼驗證輸出，是正在變重的加分項。但這是一家 AI 公司的評分卡；能不能外推到事務所或其他產業，沒有證據。"},{"t":"h3","x":"五、「預設公開」與保密前提的張力"},{"t":"p","x":"報告說，AI 密集組織需要把工作留在 agent 看得見的地方，私下的會議與私訊是被勸阻的 [[B18]]。法務的很多溝通恰好需要相反的設計：律師與當事人間的特權以保密為前提；營業秘密要求「合理的保密措施」[[law:ustrade]]；員工個資受目的限制與比例原則拘束 [[law:ccpa]]。導入時要分清楚哪些資訊進 agent 可見的空間、依什麼權限分級，而不是一律公開。"},{"t":"h3","x":"六、審閱才是新的瓶頸"},{"t":"p","x":"法務、政策與信任這一組，每人每週的 agent 輸出換算要讀 26 小時 [[fig6]]。不論這個數字多粗略，方向是確定的：產出不再是瓶頸，審閱才是。法務需要明確的分級審閱規則——哪些輸出必須逐字看、哪些抽查、哪些只看結論——並把它寫下來，否則審閱品質會隨著量增加而悄悄下降。"},{"t":"h3","x":"七、仿效報告的研究方法前，先問資料治理"},{"t":"p","x":"報告用員工的遙測、行事曆、Slack 網路與面試評分卡做了個人層級的分析 [[G8]]。在加州，這些都是 CCPA 下的員工個資，要符合告知、目的限制與比例原則 [[law:ccpa]]；若把預警系統的產出直接拿來分派個人工作，會落入加州的自動化決策規則，要給員工事前告知，原則上也要提供選擇退出 [[law:admt]]；若把評分卡編碼用在甄選，則有加州民權規則與紐約市 AEDT 法的要求 [[law:feha]] [[law:nyc144]]。台灣企業若要照搬，框架不同，見移植提醒 [[law:tw]]。"}]},{"id":"good","nav":"優點","title":"報告做對的地方","blocks":[{"t":"p","x":"批評之外，這份報告有幾處值得肯定，而且都是具體的做法："},{"t":"ul","items":["主動自承限制：共 7 處點出替代解釋或偏誤——業務成長的干擾 [[P8]]、全自主 agent 的前趨勢 [[P11]]、業務的自選 [[P12]]、調查換題 [[B2]]、無法複製 [[E6]]、再配置的取捨 [[E10]]、幫不到沒被雇用的人 [[E13]]。","品質檢驗的設計：同一人、同月、同目錄比較 agent 寫的與本人寫的程式碼，排除了人與專案的差異 [[P10]]。","暴露在結果之前量測：圖 5 的任務複雜度取自 2025 年 10 月到 12 月，早於初階人數的變化期，避開了反向因果 [[P15]]。","多源三角：人事、遙測、產出、調查、通訊、行事曆、評分卡七類資料，加上訪談 [[I2]]。","措辭節制：「相對」[[I3]]、「描述性地」[[P15]]、「同時出現」[[E4]]——作者在關鍵處沒有把相關寫成因果。"]}]},{"id":"watch","nav":"待觀察","title":"待觀察","blocks":[{"t":"ul","items":["初階的絕對人數：若 Anthropic 日後揭露總人數或初階人數，[[N1]] 的試算就能被驗證或推翻。","預警系統的設計：用哪些指標、怎麼治理、員工能否得知，以及最後的決定是否有實質人類審查 [[G7]] [[law:admt]]。","從量走到值：程式碼以外的品質指標，以及 Demirer 等人那種「實際發布」層次的成果 [[lit:demirer]]。","外部指標：Stanford 的 canaries 系列與 Hosseini & Lichtinger 的更新版，看初階雇用的落差是否持續擴大 [[lit:canaries]] [[lit:hosseini]]。","同系列的下一份報告：同一套指標若在半年後重跑，最後一個月的急升是趨勢還是雜訊，就會清楚 [[N6]]。"]}]}],"verdicts":[{"kf":"重點發現一","claim":"K1","head":"初階技術職占比下降；agent 工時是員工的 6 倍","verdict":"描述成立；兩件事是並列，不是因果","grade":"A／B","body":"三個口徑的占比都降了：在職 21% 到 14%、新進 27% 到 9%、職缺降到 6% [[L5]] [[L6]] [[L7]]。但同期公司規模成為三倍，占比下降不等於人數減少 [[N1]]。6 倍只算員工發動的互動式 session，分母是「人數乘每週 40 小時」的假設 [[P3]] [[N7]]。"},{"kf":"重點發現二","claim":"K2","head":"人均產出上升；同一員工採用後產出上升","verdict":"工程師與業務有同一人比較；其他職能只有描述","grade":"B／C","body":"工程師的新增程式碼在採用後明顯上升，前趨勢平坦，是全篇最強的因果證據 [[P9]]；業務成交客戶也上升，但作者承認有自選問題 [[P12]]。合約、查詢、發票只有描述性時間序列 [[P6]]。所有產出指標都是量，不是價值或品質 [[G12]]。"},{"kf":"重點發現三","claim":"K3","head":"注意力成為瓶頸；非技術員工讀完輸出要半週；轉向後設工作","verdict":"方向成立，數字是示意","grade":"B／C","body":"80% 的閒置是 session 層級，反映注意力被切分，不代表人慢 [[B7]]。「半週」靠最後一個月的急升：最後一個月 5 個非技術群組有 4 組超過 20 小時，前一個月只有 2 組 [[N6]]。後設工作從 10% 升到 22% 由 LLM 編碼，沒有揭露驗證 [[B11]] [[G4]]。"},{"kf":"重點發現四","claim":"K4","head":"招募主管更重自主與判斷","verdict":"方向清楚，但只有倍數，沒有占比與驗證","grade":"C","body":"提到 AI 工具紀錄的評估，技術職從約 5% 變三倍、非技術職從 7% 變四倍——還原約 15% 與 28%，仍是少數 [[H1]] [[N4]]。自主與判斷「增幅最大」、領域專長「縮小」都沒有數字 [[H2]]。編碼器沒有揭露驗證 [[G4]]。"}],"chain":{"nodes":[{"id":"a","x":10,"y":20,"t":"agent 擴散","s":"互動式 agent 工時是員工的 6 倍","g":"B","refs":["P3","L11"]},{"id":"b","x":10,"y":140,"t":"人均產出上升","s":"commit 5.1 倍；工程與業務有同一人比較","g":"B","refs":["P5","P9","P12"]},{"id":"c","x":10,"y":260,"t":"注意力成為瓶頸","s":"session 80% 在等人；開會多 20%","g":"B","refs":["B7","B8","B13"]},{"id":"d","x":280,"y":260,"t":"工作轉向管理 agent","s":"後設工作 10% → 22%（LLM 編碼）","g":"C","refs":["B11"]},{"id":"e","x":280,"y":140,"t":"招募標準改變","s":"AI 工具紀錄三到四倍；自主判斷上升","g":"C","refs":["H1","H2"]},{"id":"f","x":280,"y":20,"t":"初階占比下降","s":"在職 21% → 14%；新進 27% → 9%","g":"A","refs":["L5","L6"]},{"id":"g","x":550,"y":20,"t":"雇主回應","s":"持股、預警系統、內部再配置","g":"D","refs":["E7","E9","E10"]}],"edges":[{"a":"a","b":"b","g":"B","t":"同一人比較（僅工程、業務）"},{"a":"b","b":"c","g":"B","t":"量增加 → 審閱負荷"},{"a":"c","b":"d","g":"C","t":"訪談＋LLM 編碼"},{"a":"d","b":"e","g":"C","t":"時間上對應"},{"a":"e","b":"f","g":"C","t":"沒有直接量測","dash":true},{"a":"a","b":"f","g":"C","t":"主管自評＋圖 5 截面","dash":true},{"a":"f","b":"g","g":"D","t":"規範主張","dash":true},{"a":"g","b":"f","g":"X","t":"再配置承諾可能讓雇主更不敢雇新人","dash":true,"conflict":true}]},"policy":[{"item":"員工持股","why":"讓員工和公司的成功利害一致；類比二戰後的勞資協議 [[E7]] [[E8]]","evidence":"沒有（報告沒有提出持股效果的資料）","assess":"對多數雇主不可得；把薪資與財富押在同一家公司；類比的機制是工會集體協商，不是個別持股","law":"沒有法律要求；屬自願的報酬設計"},{"item":"預警系統","why":"及早標出受衝擊的職務，把人轉到技能相近的職務 [[E9]]","evidence":"報告自己的流動與工作內容發現 [[L17]]","assess":"設計完全沒有揭露 [[G7]]；若延伸到個人層級，就成了員工監測與自動化決策","law":"員工個資的目的限制與比例原則 [[law:ccpa]]；若無實質人類審查而用於分派工作，落入加州自動化決策規則 [[law:admt]]；歐盟據點屬高風險 AI [[law:euaia]]"},{"item":"內部再配置／保留彈性人力（推斷的第三項）","why":"逼公司去找新任務、避免平庸自動化 [[E11]] [[E12]]","evidence":"理論 [[lit:acemoglu]]","assess":"作者自承會讓雇主不敢雇新人 [[E10]]——與初階的核心發現衝突","law":"at-will：沒有法定的轉調或安置義務，再配置是自願承諾 [[law:atwill]]；大量資遣只有 60 天預告義務 [[law:warn]]"},{"item":"政府政策（再訓練與所得支持）","why":"雇主的作為擋不住衝擊，也幫不到沒被雇用的人 [[E13]]","evidence":"自家證據回顧：職訓效果有限 [[lit:roodman]]","assess":"方向對，工具弱；報告沒有把自家回顧的保守結論帶進來","law":"聯邦 TAA 自 2022 年起停止受理新案；就本站查到的範圍，沒有現成、運作中的技術性失業專門方案可以直接接上 [[law:taa]]"}],"glossary":[{"t":"初階","en":"junior／entry-level","d":"報告沒有定義（職級？年資？）。圖 1 的軸寫「% junior in category」。"},{"t":"在職人數、新進、職缺","en":"headcount／hires／open roles","d":"圖 1 的三條線，分別是存量、流入與需求。"},{"t":"互動式／自主式 session","en":"interactive／autonomous","d":"互動式是員工在旁多輪對話的 agent 工作階段；自主式是 agent 自己跑完的工作。圖 2 只算互動式。"},{"t":"子 agent","en":"subagent","d":"一個 agent 派出去平行處理子任務的 agent。圖 2 把它們的時間合併計算。"},{"t":"後設工作","en":"meta-work","d":"不是做事本身，而是打造讓 agent 做事的工具：寫 skills、替其他 agent 寫計畫與審查、監控流程、記錄工作方法。"},{"t":"常設指示","en":"standing instructions","d":"寫給 agent、長期有效的指示。報告沒有定義具體指什麼。"},{"t":"對數點","en":"log points","d":"兩個數取自然對數後的差。小於 0.1 時約等於百分比變化；大的時候要取 e 的次方換算成倍數（N3）。"},{"t":"交錯採用","en":"staggered adoption","d":"不同的人在不同時間開始用新工具。可以比較同一個月裡已採用與未採用的人。"},{"t":"雙向固定效果","en":"two-way fixed effects","d":"同時控制「每個人固有的差異」與「每個月共同的衝擊」的迴歸。在交錯採用、效果因人因時而異時有已知偏誤。"},{"t":"前趨勢","en":"pre-trend","d":"採用之前，採用者與對照組的走勢是否已經不同。不同的話，採用後的差距不能全算成效果。"},{"t":"信賴區間","en":"confidence interval","d":"估計值的不確定範圍；圖 4 的直槓是 95% 信賴區間。"},{"t":"loess 平滑","en":"loess smoother","d":"局部加權的平滑曲線；在序列的兩端容易誇大彎曲。"},{"t":"自動編碼器／LLM 評分器","en":"automated coder／grader","d":"用語言模型替文字分類或打分數。是量尺，不是事實；需要人工驗證才知道準不準。"},{"t":"牆鐘時間","en":"wall-clock time","d":"從開始到結束實際經過的時間，包含等待。"},{"t":"平價線","en":"parity","d":"圖 2 縱軸等於 1 的線：agent 工時等於人類工時。"},{"t":"取代效果、恢復效果","en":"displacement／reinstatement","d":"Acemoglu & Restrepo 的架構：自動化把任務從人移給機器；新任務把工作帶回給人。"},{"t":"平庸自動化","en":"so-so automation","d":"機器只勉強勝過人：雇主換掉人，生產力卻只多一點點。"},{"t":"無效率自動化","en":"inefficient automation","d":"報告與平庸自動化並列使用：社會成本（被取代者的所得損失）大於生產力效益的自動化。"},{"t":"預警系統","en":"early warning system","d":"Anthropic 用職務層級的需求與生產力指標，對照 AI 能力與使用，標出可能受衝擊的職務。細節未揭露。"},{"t":"at-will 雇用","en":"employment at will","d":"美國多數州（含加州）的預設規則：未定期限的雇用，任一方得通知後隨時終止。"},{"t":"文字片段定位","en":"Text Fragment","d":"網址後加上「#:~:text=」，瀏覽器打開時會捲到並標亮那段文字。本站的「原文定位」用的就是它。"}],"stats":{"claims":76,"calcs":18,"gaps":18,"gaps_high":4,"figs":8,"lit":12,"law":10,"self":7,"gA":7,"gB":23,"gC":23,"gD":19,"gX":4,"nums":95,"figlabels":81,"anchors":88,"web":76,"read":85,"built":"2026-10-19"}};</script>
<script>/* Anthropic 就業報告拆解——前端。資料在 window.DATA（build.py 注入）。改完先跑 node --check tools/app.js */
(function () {
  "use strict";
  var D = window.DATA;
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  };
  var by = function (arr, k) { var m = {}; arr.forEach(function (x) { m[x[k || "id"]] = x; }); return m; };
  var CL = by(D.claims), FG = by(D.figs), NC = by(D.calcs), GP = by(D.gaps), LT = by(D.lit), LW = by(D.law);
  var TYPE = {}; D.types.forEach(function (t) { TYPE[t.k] = t.zh; });
  var SRC = {}; D.sources.forEach(function (s) { SRC[s.k] = s.zh; });
  var GRADE = {}; D.grades.forEach(function (g) { GRADE[g.k] = g; });
  var SEC = by(D.sections, "k");
  var gcls = function (g) { return "g" + (g === "-" ? "X" : g); };

  /* ---------------------------------------------------------------- 連結 */
  function tf(phrase) {
    return D.meta.url_web + "#:~:text=" + encodeURIComponent(phrase).replace(/-/g, "%2D");
  }
  function pdfUrl(p) { return D.meta.url_pdf + "#page=" + p; }
  function secUrl(k) { var s = SEC[k]; return s && s.web ? D.meta.url_web + "#" + s.web : D.meta.url_web; }
  function ext(href, text) { return '<a href="' + esc(href) + '" target="_blank" rel="noopener">' + text + "</a>"; }

  function refKind(r) {
    if (r.indexOf("lit:") === 0) return "lit";
    if (r.indexOf("law:") === 0) return "law";
    if (/^fig\d$/.test(r)) return "fig";
    if (/^N\d+$/.test(r)) return "calc";
    if (/^G\d+$/.test(r)) return "gap";
    return "claim";
  }
  function refLabel(r) {
    var k = refKind(r);
    if (k === "lit") { var l = LT[r.slice(4)]; return l ? l.short : r; }
    if (k === "law") { var w = LW[r.slice(4)]; return w ? (w.chip || w.short) : r; }
    if (k === "fig") return "圖 " + r.slice(3);
    return r;
  }
  function chip(r) {
    var k = refKind(r), cls;
    if (k === "claim") cls = CL[r] ? gcls(CL[r].grade) : "gX";
    else cls = { calc: "kcalc", gap: "kgap", fig: "kfig", lit: "klit", law: "klaw" }[k];
    var title = { claim: "主張", calc: "數字核算", gap: "報告沒說的", fig: "圖", lit: "文獻", law: "法條" }[k];
    return '<a class="chip ' + cls + '" href="#ref/' + esc(r) + '" data-ref="' + esc(r) + '" title="' + title + '">' + esc(refLabel(r)) + "</a>";
  }
  /* 行內標記：**粗體**、[[ref]]；轉述裡的代號（L5、N1、G3）自動變成可點的標籤 */
  function md(s, auto) {
    var out = esc(s);
    if (auto) {
      out = out.replace(/(^|[^A-Za-z0-9#\/\-\[])((?:[KILPBHE]\d{1,2}|N\d{1,2}|G\d{1,2}))(?![A-Za-z0-9\]])/g, function (m, pre, id) {
        return (CL[id] || NC[id] || GP[id]) ? pre + chip(id) : m;
      });
    }
    out = out.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
    out = out.replace(/\[\[([^\]]+)\]\]/g, function (_, r) { return chip(r); });
    return out;
  }
  function coordOf(c) {
    var k = c.key, loc;
    if (/^KF/.test(k)) loc = "§1 重點發現 " + k.slice(2);
    else if (/^fig/.test(k)) loc = "圖 " + k.slice(3) + " 圖說";
    else if (k === "fn1") loc = "註 1";
    else loc = "§" + c.sec.slice(1) + k;
    return loc + " · p." + c.p.join("–");
  }
  function gradeBadge(g) {
    var G = GRADE[g];
    return '<span class="badge g ' + gcls(g) + '" title="' + esc(G.d) + '">' + (g === "-" ? "聲明" : g + "　" + G.zh) + "</span>";
  }

  /* ---------------------------------------------------------------- 卡片 */
  function claimCard(c) {
    var src = c.src.map(function (s) { return SRC[s]; }).join("、");
    return '<article class="card claim" id="c-' + c.id + '">' +
      '<div class="row1"><span class="id">' + c.id + "</span>" + gradeBadge(c.grade) +
      '<span class="typ">' + TYPE[c.type] + (src ? "・" + esc(src) : "") + "</span>" +
      (c.self ? '<span class="badge self" title="報告自己點出了這個限制">報告自承</span>' : "") +
      '<span class="coord" title="段落座標：§節¶段 · PDF 頁次">' + esc(coordOf(c)) + "</span>" +
      '<span class="src-links">' + (c.web ? ext(tf(c.web), "原文定位") : "") + ext(pdfUrl(c.p[0]), "PDF 第 " + c.p[0] + " 頁") + "</span></div>" +
      '<p class="zh">' + md(c.zh, true) + "</p>" +
      (c.note ? '<p class="note">' + md(c.note, true) + "</p>" : "") +
      (c.refs.length ? '<div class="refs">相關　' + c.refs.map(chip).join(" ") + "</div>" : "") +
      "</article>";
  }
  function labelList(arr, badge) {
    if (!arr || !arr.length) return "";
    return '<div class="labels">' + arr.map(function (x) {
      return '<span class="lab"><b>' + esc(x[0]) + "</b>　" + esc(x[1]) + "</span>";
    }).join("") + (badge || "") + "</div>";
  }
  function figBody(f, withChart) {
    var s = '<p class="small muted"><span class="en">' + esc(f.title_en) + "</span>" +
      (f.title_img ? "　圖框大標題：<span class=\"en\">" + esc(f.title_img) + "</span>" : "") + "</p>" +
      "<p>" + md(f.what, true) + "</p>";
    if (f.printed.length) s += '<h4>圖內標示 <span class="badge ocr">OCR 核對</span></h4>' + labelList(f.printed);
    if (f.read.length) s += '<h4>讀圖估計 <span class="badge read">讀圖</span></h4>' + labelList(f.read);
    if (withChart && f.chart) s += chartSlot(f.chart, f.id);
    s += '<div class="two"><div><h4>撐得起</h4><ul>' + f.shows.map(function (x) { return "<li>" + md(x, true) + "</li>"; }).join("") +
      '</ul></div><div><h4>撐不起或要小心</h4><ul>' + f.limits.map(function (x) { return "<li>" + md(x, true) + "</li>"; }).join("") + "</ul></div></div>";
    s += '<div class="refs small" style="margin-top:8px">相關主張　' + f.claims.map(chip).join(" ") + "</div>";
    s += '<p class="src-links small" style="margin-top:8px">' + ext(pdfUrl(f.p), "PDF 第 " + f.p + " 頁看原圖") + ext(secUrl(f.sec), "網頁版所在章節") + "</p>";
    return s;
  }
  function calcBody(n, withChart) {
    var s = '<dl class="kv"><dt>輸入</dt><dd>' + md(n.inputs, true) + "</dd><dt>公式</dt><dd>" + md(n.formula) + "</dd>" +
      "<dt>結果</dt><dd><b>" + md(n.result, true) + "</b></dd><dt>怎麼讀</dt><dd>" + md(n.reading, true) + "</dd>" +
      (n.caveat ? "<dt>注意</dt><dd>" + md(n.caveat, true) + "</dd>" : "") + "</dl>";
    if (withChart && n.chart) s += chartSlot(n.chart, n.id);
    s += '<div class="refs small">相關　' + n.refs.map(chip).join(" ") + "</div>";
    return s;
  }
  function gapBody(g) {
    var cls = { "高": "h", "中": "m", "低": "l" }[g.sev];
    return '<p><span class="sev ' + cls + '">嚴重度：' + g.sev + "</span></p><p>" + md(g.body, true) + "</p>" +
      '<p class="muted">為什麼重要　' + md(g.why, true) + "</p>" +
      '<div class="refs small">相關　' + g.refs.map(chip).join(" ") + "</div>";
  }
  var VD = { ok: "忠實", omits: "省略了限定", unchecked: "未核對", missing: "未引用" };
  function litBody(l) {
    return '<p><span class="vd ' + l.verdict + '">' + VD[l.verdict] + "</span>　" + esc(l.kind) + "</p>" +
      '<p><span class="en">' + esc(l.title) + "</span>　<span class=\"small muted\">" + esc(l.venue) + "</span></p>" +
      '<dl class="kv"><dt>報告怎麼用</dt><dd>' + esc(l.used) + "</dd><dt>核對來源</dt><dd>" + esc(l.checked) + "</dd>" +
      "<dt>它說了什麼</dt><dd>" + md(l.facts) + "</dd><dt>轉述是否忠實</dt><dd>" + md(l.fidelity) + "</dd></dl>" +
      '<p class="small">' + ext(l.url, "原文連結") + "</p>";
  }
  function lawBody(l) {
    return '<blockquote lang="' + (l.id === "tw" ? "zh-Hant" : "en") + '">' + esc(l.text) + "</blockquote>" +
      (l.zh ? '<p class="zh">' + esc(l.zh) + "</p>" : "") +
      '<p class="note"><b>對應</b>　' + md(l.note) + "</p>" +

  var spyObs = null;
  function spy() {
    if (!("IntersectionObserver" in window)) return;
    if (spyObs) spyObs.disconnect();
    var links = {}; document.querySelectorAll("[data-toc]").forEach(function (a) { links[a.getAttribute("data-toc")] = a; });
    spyObs = new IntersectionObserver(function (ents) {
      ents.forEach(function (e) {
        if (e.isIntersecting) {
          Object.keys(links).forEach(function (k) { links[k].classList.remove("on"); });
          var a = links[e.target.id.slice(2)]; if (a) a.classList.add("on");
        }
      });
    }, { rootMargin: "-70px 0px -70% 0px" });
    document.querySelectorAll("#v-report h2[id^=r-]").forEach(function (h) { spyObs.observe(h); });
  }

  function listClaims() {
    var q = F.q.toLowerCase();

      if (F.src && c.src.indexOf(F.src) < 0) return false;
      if (F.self && !c.self) return false;
      if (q && (c.id + " " + c.zh + " " + c.note).toLowerCase().indexOf(q) < 0) return false;
      return true;

    rows.forEach(function (c) {

      "<li><b>法律對照不是法律意見。</b>只指出報告的做法在哪些規範下要注意，沒有就任何事實做結論。</li></ul>" +
      "<h2>重建方式</h2><p>資料層在 <code>tools/data_*.py</code>。原報告不在 repo 裡：先自行下載 PDF，然後依序執行 " +
      "<code>python tools/extract.py 報告.pdf</code>、<code>python tools/fetch_web.py</code>、<code>python tools/ocr_figs.py</code>（需要 poppler、PyMuPDF、Tesseract），" +
      "產物在 <code>source/</code>，已列入 .gitignore。最後 <code>python tools/build.py</code> 產出 <code>index.html</code> 與 <code>report.md</code>；任何一項核對不通過就不會產出。</p>" +
      "<h2>詞彙</h2><dl class=\"kv\" style=\"grid-template-columns:9em minmax(0,1fr)\">" +
      D.glossary.map(function (g) { return "<dt><b>" + esc(g.t) + '</b><br><span class="small en">' + esc(g.en) + "</span></dt><dd>" + md(g.d, true) + "</dd>"; }).join("") + "</dl>" +
      '<p class="small muted">建置日期 ' + esc(s.built) + "。</p>";
  }
  function renderAbout() {
    var m = D.meta;
    $("v-about").innerHTML = "<h1>關於</h1>" +
      '<p class="lede">這是一名台灣法律工作者替自己做的報告分析筆記。做它的理由：這份報告講的是 AI 怎麼改變一家公司的就業，其中有法務的資料點、有招募標準的轉向，' +
      "也有一段值得法律人細讀的政策建議；而它最重要的數字（占比、倍數、相對變化）線性讀一次很容易讀錯意思。</p>" +
      "<h2>報告</h2><p>" + esc(m.authors.join("、")) + "。<span class=\"en\">" + esc(m.title_en) + "</span>。" + esc(m.institution) + "，" + esc(m.doc_type) + "，" + esc(m.date) + "。</p>" +
      '<p class="src-links">' + ext(m.url_web, "原文網頁") + ext(m.url_pdf, "原文 PDF") + "</p>" +
      "<h2>作者</h2><p>蔡宗穎（Camus Tsai）。台灣 IP 法律人，專利訴訟／SEP-FRAND／AI 工作流。" + ext("https://cecefat.github.io/cv/", "線上履歷") + "。</p>" +
      "<p>這個站的做法：我訂定流程與驗證規則（逐段座標、數字機械核對、讀圖必須標示、不轉載原文），程式、資料整理與分析初稿由 Claude（AI）撰寫。" +
      "Claude 是 Anthropic 的模型，而這份報告是 Anthropic 的出版品——這是利益衝突，見「方法」頁的揭露。</p>" +
      "<h2>同一套做法的其他站</h2><ul>" +
      "<li>" + ext("https://cecefat.github.io/ai-misuse-lex/", "AI 濫用威脅圖譜") + "　Anthropic 威脅情報報告的中文索引。</li>" +
      "<li>" + ext("https://cecefat.github.io/claude-sysprompt-study/", "Claude 系統提示詞演變自學站") + "　公開 system prompt 的 changelog 與證據包。</li>" +
      "<li>" + ext("https://cecefat.github.io/rlhf-lex/", "RLHF 知識圖譜") + "　一本 RLHF 專書的概念、公式與檢核題。</li>" +
      "<li>" + ext("https://cecefat.github.io/ukipo-lex/", "英國 SEP／FRAND 因子知識圖譜") + "　英國判決的因子字典、矩陣與教義圖譜。</li></ul>" +
      "<h2>與 Anthropic 的關係</h2><p>沒有關係。本站不是 Anthropic 的出版品，未經其審閱或背書。" + esc(m.rights_note) + "</p>" +
      '<p class="small muted">' + esc(m.copyright) + "（原報告）。</p>" +
      '<p class="small muted">建置日期 ' + esc(D.stats.built) + "。原始碼：" + ext("https://github.com/CeceFat/ai-employment-lex", "github.com/CeceFat/ai-employment-lex") + "</p>";
  }

  /* ---------------------------------------------------------------- 路由 */
  var VIEWS = [["report", "報告"], ["claims", "主張帳本"], ["figs", "八張圖"], ["calcs", "數字核算"], ["gaps", "報告沒說的"], ["lit", "文獻"], ["method", "方法"], ["about", "關於"]];
  var RENDER = { report: renderReport, claims: renderClaims, figs: renderFigs, calcs: renderCalcs, gaps: renderGaps, lit: renderLit, method: renderMethod, about: renderAbout };
  var rendered = {}, current = null;
  $("nav").innerHTML = VIEWS.map(function (v) { return '<a href="#' + v[0] + '" data-v="' + v[0] + '">' + v[1] + "</a>"; }).join("");

  function show(view, item) {
    if (!RENDER[view]) { view = "report"; item = null; }
    if (current !== view) {
      VIEWS.forEach(function (v) { $("v-" + v[0]).classList.toggle("on", v[0] === view); });
      document.querySelectorAll("#nav a").forEach(function (a) {
        if (a.getAttribute("data-v") === view) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
      });
      if (!rendered[view]) { CHARTS = CHARTS.filter(function (c) { return $(c.id); }); RENDER[view](); rendered[view] = true; }
      current = view;
      if (!item) window.scrollTo(0, 0);
    }
    drawCharts(); if (view === "report") drawChain();
    if (item) {
      var target = view === "report" ? $("r-" + item) || $("law-" + item)
        : $({ claims: "c-", figs: "f-", calcs: "n-", gaps: "g-", lit: "l-" }[view] + item);
      if (view === "claims" && !target) { F = { q: "", sec: "", grade: "", type: "", src: "", self: false }; renderClaims(); target = $("c-" + item); }
      if (target) {
        target.scrollIntoView({ block: "start" });
        if (target.classList.contains("claim") || target.classList.contains("item")) {
          target.classList.add("flash"); setTimeout(function () { target.classList.remove("flash"); }, 1800);
        }
      }
    }
  }
  function route() {
    var h = decodeURIComponent(location.hash.replace(/^#/, ""));
    if (h.indexOf("ref/") === 0) { if (!current) show("report"); openRef(h.slice(4)); return; }
    var parts = h.split("/");
    show(parts[0] || "report", parts.slice(1).join("/") || null);
  }
  document.addEventListener("click", function (ev) {
    var a = ev.target.closest && ev.target.closest("[data-ref]");
    if (a) { ev.preventDefault(); openRef(a.getAttribute("data-ref")); return; }
    var inDrawer = ev.target.closest && ev.target.closest("#drawer a[href^='#']");
    if (inDrawer) closeDrawer();
  });
  $("scrim").addEventListener("click", closeDrawer);
  document.addEventListener("keydown", function (ev) { if (ev.key === "Escape" && !$("drawer").hidden) closeDrawer(); });
  window.addEventListener("hashchange", route);
  var rt = null;
  window.addEventListener("resize", function () {
    clearTimeout(rt);
    rt = setTimeout(function () {
      document.querySelectorAll(".chart[data-w]").forEach(function (el) { el.removeAttribute("data-w"); });
      drawCharts(); drawChain();
    }, 160);
  });

  /* 深淺色：存在 localStorage（可能被擋，失敗就只在本頁有效） */
  function setTheme(t) {
    if (t) document.documentElement.setAttribute("data-theme", t); else document.documentElement.removeAttribute("data-theme");
  }
  try { setTheme(localStorage.getItem("aelex-theme")); } catch (e) { /* 無痕或封鎖時略過 */ }
  $("theme").addEventListener("click", function () {
    var cur = document.documentElement.getAttribute("data-theme");
    var dark = cur ? cur === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
    var next = dark ? "light" : "dark";
    setTheme(next);
    try { localStorage.setItem("aelex-theme", next); } catch (e) { /* 略過 */ }
  });

  $("foot").innerHTML = "獨立分析筆記，與 Anthropic 無關；不含報告全文。原報告 " + esc(D.meta.copyright) + "。分析初稿由 AI 撰寫，可能有誤，請以原文為準。建置 " + esc(D.stats.built) + "。　" +
    '<a href="#method">方法與限制</a>　<a href="#about">關於</a>　' + ext("https://github.com/CeceFat/ai-employment-lex", "原始碼");
  route();
})();
</script>
</body>
</html>
